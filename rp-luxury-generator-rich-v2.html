<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rose Character — Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#171313;color:#eee;font-family:"Noto Sans Thai",sans-serif}
.generator{width:min(1180px,96%);margin:22px auto;display:grid;grid-template-columns:350px 1fr;gap:18px}
.panel,.preview{border:1px solid #ffffff18;background:#211b1b;border-radius:14px}
.panel{padding:18px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.preview{min-height:700px;padding:24px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
h1{font:600 25px/1 "Cormorant Garamond";margin:0 0 5px}
.desc{font-size:10px;color:#9f9590;margin-bottom:18px}
.group{padding:13px 0;border-top:1px solid #ffffff12}
.group:first-of-type{border-top:0}
.group-title{font:8px "DM Mono";letter-spacing:.15em;color:#c97b80;margin-bottom:9px}
label{display:block;font-size:10px;color:#bdb3ae;margin:8px 0 4px}
input[type=text],input[type=url],textarea,select{width:100%;border:1px solid #ffffff16;background:#151111;color:#eee;border-radius:7px;padding:9px 10px;font:11px "Noto Sans Thai";outline:none}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:#8d4a50}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range{display:grid;grid-template-columns:1fr 45px;gap:8px;align-items:center}
.range input{width:100%;accent-color:#9d5158}
.val{font:8px "DM Mono";color:#a89d98;text-align:right}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.toolbar button{border:1px solid #ffffff16;background:#171212;color:#cfc6c0;border-radius:5px;padding:5px 7px;font:9px "DM Mono";cursor:pointer}
.toolbar button:hover{border-color:#9d5158;color:#fff}
.editor{min-height:120px;padding:10px;border:1px solid #ffffff16;background:#151111;border-radius:7px;font-size:11px;line-height:1.9;color:#eee;outline:none}
.editor:focus{border-color:#8d4a50}
.count{font:8px "DM Mono";color:#817772;text-align:right;margin-top:5px}
.actions{display:flex;gap:7px;margin-top:15px}
.actions button{flex:1;border:0;border-radius:7px;padding:10px;cursor:pointer;font:9px "DM Mono";letter-spacing:.08em}
.primary{background:#8a3b42;color:#fff}
.secondary{background:#332a29;color:#ddd}
.output{margin-top:10px;width:100%;min-height:110px;font:9px/1.5 monospace;background:#110d0d;color:#bdb4ae;border:1px solid #ffffff12;border-radius:7px;padding:9px;display:none}
@media(max-width:850px){.generator{grid-template-columns:1fr}.panel{max-height:none}.preview{min-height:500px}}
/* preview */
.rose-ui{--rose-bg:url("https://i.pinimg.com/736x/1a/f0/b9/1af0b9b1cba7168bd537f13ca18c26e0.jpg");--ink:#292322;--soft:#766d69;--wine:#7d3036;--glass:#faf8f3ee;width:min(570px,100%);margin:0 auto;padding:0 18px 24px;position:relative;overflow:hidden;background:linear-gradient(180deg,#180b0b18,#10070712),var(--rose-bg) center/cover no-repeat;color:var(--ink);font-family:"Noto Sans Thai",sans-serif;box-shadow:0 20px 50px #0008}
.rose-ui:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff55;box-shadow:inset 0 0 35px #0002;pointer-events:none;z-index:1}
.rose-ui:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,#ffffff30,transparent 28%),linear-gradient(90deg,#0003,transparent 20%,transparent 80%,#0003)}
.rose-ui>*{position:relative;z-index:3}
.rose-top{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;color:#fff;text-shadow:0 1px 7px #000}
.rose-top .left,.rose-top .right{font:7px "DM Mono";letter-spacing:.14em}.rose-top .right{text-align:right}.rose-top .center{width:5px;height:5px;border:1px solid #fff;transform:rotate(45deg);opacity:.8}
.rose-hero{position:relative;width:88%;height:225px;margin:0 auto;padding:8px;background:#f8f6f1;box-shadow:0 14px 30px #0005}
.rose-hero img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;filter:saturate(.88) contrast(.96)}
.rose-hero:after{content:"";position:absolute;inset:8px;background:linear-gradient(180deg,transparent 50%,#0007);pointer-events:none}
.rose-frame{position:absolute;left:18px;bottom:17px;z-index:2;color:#fff;font:7px "DM Mono";letter-spacing:.15em;text-shadow:0 1px 5px #000}
.rose-identity{position:relative;width:76%;margin:-30px auto 0;padding:12px 18px 11px;text-align:center;background:rgba(250,248,243,.94);box-shadow:0 8px 20px #0003;z-index:4}
.rose-identity:before{content:"";position:absolute;top:0;left:50%;width:32px;height:1px;transform:translateX(-50%);background:var(--wine)}
.rose-kicker{margin-bottom:3px;color:var(--wine);font:6px "DM Mono";letter-spacing:.22em}
.rose-name{font:600 34px/.9 "Cormorant Garamond";letter-spacing:.045em;color:#25201f}
.rose-sub{margin-top:4px;color:#756b67;font:400 11px "Cormorant Garamond";letter-spacing:.18em}
.rose-divider{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.rose-divider span{width:17px;height:1px;background:#9b8580}.rose-divider i{width:4px;height:4px;border:1px solid var(--wine);transform:rotate(45deg)}
.rose-motto{width:82%;margin:13px auto 0;text-align:center;color:#fff;font:italic 12px/1.5 "Cormorant Garamond";letter-spacing:.03em;text-shadow:0 1px 7px #000}
.rose-motto:before,.rose-motto:after{content:"";display:inline-block;width:22px;height:1px;vertical-align:middle;margin:0 8px;background:#fff9}
.rose-content{width:82%;margin:18px auto 0;display:flex;flex-direction:column;gap:11px}
.rose-box{width:100%;height:auto;padding:14px 17px;position:relative;background:var(--glass);border:1px solid #ffffff55;box-shadow:0 7px 20px #0004}
.rose-box:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--wine);opacity:.8}
.rose-box:after{content:"";position:absolute;right:8px;bottom:8px;width:9px;height:9px;border-right:1px solid #7d303655;border-bottom:1px solid #7d303655}
.rose-box-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid #29232220}
.rose-box-title{color:var(--wine);font:8px "DM Mono";letter-spacing:.15em}.rose-box-no{color:#aaa19c;font:7px "DM Mono"}
.rose-role{height:auto;color:#393331;font-size:11px;line-height:1.95}.rose-role p{margin:0 0 9px}.rose-role p:last-child{margin-bottom:0}
.rose-note{height:auto;color:#625a56;font-size:10px;line-height:1.8}.rose-note-line{width:26px;height:1px;margin:0 0 9px;background:var(--wine)}
.rose-bottom{width:82%;margin:13px auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#fff;text-shadow:0 1px 5px #000}
.rose-bottom span{font:7px "DM Mono";letter-spacing:.14em}.rose-bottom span:last-child{text-align:right}.rose-dot{display:flex;gap:5px}.rose-dot i{display:block;width:4px;height:4px;border:1px solid #fff;border-radius:50%}.rose-dot i:first-child{background:#fff}
</style>
</head>
<body>
<div class="generator">
<section class="panel">
<h1>Rose Character</h1>
<div class="desc">ฟอร์มสร้างโปรไฟล์โรลเพลย์ · Live Preview</div>

<div class="group">
<div class="group-title">BACKGROUND</div>
<label>URL รูปพื้นหลัง</label>
<input id="bg" type="url" value="https://i.pinimg.com/736x/1a/f0/b9/1af0b9b1cba7168bd537f13ca18c26e0.jpg">
<label>URL รูปตัวละคร</label>
<input id="photo" type="url" placeholder="วาง URL รูปตัวละคร">
</div>

<div class="group">
<div class="group-title">CHARACTER</div>
<div class="row">
<div><label>ชื่อ</label><input id="name" type="text" value="TRISTIAN"></div>
<div><label>นามสกุล</label><input id="sur" type="text" value="Sidney Kennedy"></div>
</div>
<label>Label</label><input id="label" type="text" value="CHARACTER">
<label>คำโปรย / Motto</label><input id="motto" type="text" value="The wound is gone, but the pain remembers.">
</div>

<div class="group">
<div class="group-title">TOP / FOOTER</div>
<div class="row">
<div><label>ซ้ายบน</label><input id="topLeft" type="text" value="PRIVATE SCENE"></div>
<div><label>ขวาบน</label><input id="topRight" type="text" value="TRIS / 001"></div>
</div>
<div class="row">
<div><label>ซ้ายล่าง</label><input id="footLeft" type="text" value="ROSE / MEMORY"></div>
<div><label>ขวาล่าง</label><input id="birthday" type="text" value="28 · 08 · 90"></div>
</div>
<label>ข้อความบนรูป</label><input id="frame" type="text" value="FRAME 01 · PORTRAIT">
</div>

<div class="group">
<div class="group-title">RP</div>
<div class="toolbar">
<button onclick="cmd('bold')"><b>B</b></button>
<button onclick="cmd('italic')"><i>I</i></button>
<button onclick="cmd('underline')"><u>U</u></button>
<button onclick="cmd('strikeThrough')"><s>S</s></button>
<button onclick="cmd('justifyLeft')">L</button>
<button onclick="cmd('justifyCenter')">C</button>
<button onclick="cmd('justifyRight')">R</button>
<button onclick="cmd('insertUnorderedList')">• LIST</button>
</div>
<div id="rp" class="editor" contenteditable="true"><p>ทริสเตียนยืนนิ่งอยู่ครู่หนึ่ง ปล่อยให้เสียงรอบตัวค่อย ๆ เงียบลง ก่อนจะหันกลับไปมองอีกฝ่ายด้วยรอยยิ้มบาง ๆ</p><p>“ไม่เป็นไรครับ... ทริสยังอยู่ตรงนี้”</p></div>
<div class="count" id="count">0 คำ</div>
</div>

<div class="group">
<div class="group-title">NOTE</div>
<textarea id="note" placeholder="รายละเอียดเล็ก ๆ ที่เกิดขึ้นระหว่างฉาก">รายละเอียดเล็ก ๆ ที่เกิดขึ้นระหว่างฉาก</textarea>
</div>

<div class="group">
<div class="group-title">SIZE</div>
<label>ความสูงรูป <span id="photoHVal" class="val"></span></label>
<div class="range"><input id="photoH" type="range" min="170" max="330" value="225"><span class="val" id="photoHV"></span></div>
<label>ขนาดชื่อ <span id="nameSizeV" class="val"></span></label>
<div class="range"><input id="nameSize" type="range" min="28" max="46" value="34"><span class="val" id="nameSizeV2"></span></div>
</div>

<div class="actions">
<button class="primary" onclick="generate()">GENERATE CODE</button>
<button class="secondary" onclick="resetForm()">RESET</button>
</div>
<button class="secondary" style="width:100%;margin-top:7px" onclick="copyCode()">COPY CODE</button>
<textarea id="output" class="output" readonly></textarea>
</section>

<section class="preview">
<div id="preview"></div>
</section>
</div>

<script>
const ids=['bg','photo','name','sur','label','motto','topLeft','topRight','footLeft','birthday','frame','note','photoH','nameSize'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cmd(c){document.execCommand(c,false,null);$('rp').focus();update()}
function words(t){try{return [...new Intl.Segmenter('th',{granularity:'word'}).segment(t)].filter(x=>x.isWordLike).length}catch(e){return t.trim()?t.trim().split(/\s+/).length:0}}
function updateCount(){$('count').textContent=words($('rp').innerText)+' คำ'}
function data(){return {bg:$('bg').value||'https://i.pinimg.com/736x/1a/f0/b9/1af0b9b1cba7168bd537f13ca18c26e0.jpg',photo:$('photo').value,name:$('name').value,sur:$('sur').value,label:$('label').value,motto:$('motto').value,topLeft:$('topLeft').value,topRight:$('topRight').value,footLeft:$('footLeft').value,birthday:$('birthday').value,frame:$('frame').value,rp:$('rp').innerHTML,note:$('note').value,photoH:$('photoH').value,nameSize:$('nameSize').value}}
function update(){
const d=data();
$('preview').innerHTML=`
<div class="rose-ui" style="--rose-bg:url('${esc(d.bg)}')">
<div class="rose-top"><div class="left">${esc(d.topLeft)}</div><div class="center"></div><div class="right">${esc(d.topRight)}</div></div>
<div class="rose-hero" style="height:${d.photoH}px"><img src="${esc(d.photo||'https://placehold.co/900x600/241919/eee?text=CHARACTER')}" onerror="this.src='https://placehold.co/900x600/241919/eee?text=CHARACTER'"><div class="rose-frame">${esc(d.frame)}</div></div>
<div class="rose-identity"><div class="rose-kicker">${esc(d.label)}</div><div class="rose-name" style="font-size:${d.nameSize}px">${esc(d.name)}</div><div class="rose-sub">${esc(d.sur)}</div><div class="rose-divider"><span></span><i></i><span></span></div></div>
<div class="rose-motto">${esc(d.motto)}</div>
<div class="rose-content">
<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">SCENE</div><div class="rose-box-no">01</div></div><div class="rose-role">${d.rp}</div></div>
<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">NOTE</div><div class="rose-box-no">02</div></div><div class="rose-note"><div class="rose-note-line"></div>${esc(d.note).replace(/\n/g,'<br>')}</div></div>
</div>
<div class="rose-bottom"><span>${esc(d.footLeft)}</span><div class="rose-dot"><i></i><i></i><i></i></div><span>${esc(d.birthday)}</span></div>
</div>`;
$('photoHV').textContent=d.photoH+'px';$('nameSizeV2').textContent=d.nameSize+'px';updateCount()
}
function generated(){
const d=data();
const css=document.querySelector('style').textContent.split('/* preview */')[1].replace(/<\\/style>/g,'');
return `<style>/* Rose Character — generated */\n${css}</style>
<div class="rose-ui" style="--rose-bg:url("${esc(d.bg)}")">
<div class="rose-top"><div class="left">${esc(d.topLeft)}</div><div class="center"></div><div class="right">${esc(d.topRight)}</div></div>
<div class="rose-hero" style="height:${d.photoH}px"><img src="${esc(d.photo||'https://placehold.co/900x600/241919/eee?text=CHARACTER')}"><div class="rose-frame">${esc(d.frame)}</div></div>
<div class="rose-identity"><div class="rose-kicker">${esc(d.label)}</div><div class="rose-name" style="font-size:${d.nameSize}px">${esc(d.name)}</div><div class="rose-sub">${esc(d.sur)}</div><div class="rose-divider"><span></span><i></i><span></span></div></div>
<div class="rose-motto">${esc(d.motto)}</div>
<div class="rose-content">
<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">SCENE</div><div class="rose-box-no">01</div></div><div class="rose-role">${d.rp}</div></div>
<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">NOTE</div><div class="rose-box-no">02</div></div><div class="rose-note"><div class="rose-note-line"></div>${esc(d.note).replace(/\n/g,'<br>')}</div></div>
</div>
<div class="rose-bottom"><span>${esc(d.footLeft)}</span><div class="rose-dot"><i></i><i></i><i></i></div><span>${esc(d.birthday)}</span></div>
</div>`}
function generate(){$('output').value=generated();$('output').style.display='block'}
async function copyCode(){if(!$('output').value)generate();try{await navigator.clipboard.writeText($('output').value);alert('คัดลอกโค้ดแล้ว ✨')}catch(e){$('output').select();document.execCommand('copy');alert('คัดลอกโค้ดแล้ว ✨')}}
function resetForm(){location.reload()}
ids.forEach(id=>{const el=$(id);if(el){el.addEventListener('input',update);el.addEventListener('change',update)}})
update()
</script>
</body>
</html>
