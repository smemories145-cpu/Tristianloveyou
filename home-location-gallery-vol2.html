<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Home · Location Gallery Vol.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f3f1ed;color:#493f40;font:13px/1.7 'Noto Serif Thai',serif}header{padding:26px 22px;background:#fffcf8;border-bottom:1px solid #ded9d3}header>div{max-width:1250px;margin:auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}h1{margin:0;font:600 28px 'Playfair Display',serif;color:#5d6857}header p{margin:3px 0 0;color:#938c87}.back{color:#926f7c;text-decoration:none}.container{max-width:1250px;margin:0 auto;padding:20px 14px 55px}.settings{background:#fffdf9;border:1px solid #ddd6cf;border-radius:13px;padding:17px;margin-bottom:17px;box-shadow:0 4px 20px #71675b0a}h2{font-size:14px;margin:0 0 10px;color:#756c65}.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.inputs label{font-size:11px;color:#7d7370;display:block}.inputs input,.inputs textarea{width:100%;margin-top:5px;border-radius:7px;border:1px solid #d9d3cd;padding:9px 11px;background:#fff;color:#524b46;font:13px 'Noto Serif Thai',serif}.inputs textarea{height:86px;resize:vertical}.inputs .wide{grid-column:span 2}.note{font-size:11px;color:#91877f;margin:9px 0 0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.design{min-width:0;background:#fffefa;border:1px solid #ddd5d0;border-radius:13px;overflow:hidden;box-shadow:0 7px 22px #756e640d}.design-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e8e1db}.design-head strong{font:600 13px 'DM Sans',sans-serif;color:#5b6157}.design-head small{color:#938b86;display:block;font-size:11px}.design-actions{display:flex;gap:6px;flex-shrink:0}button{border:1px solid #c8b9b0;background:#fbf3ed;color:#76585f;padding:8px 10px;border-radius:7px;font:600 11px 'Noto Serif Thai',serif;cursor:pointer}button:hover{background:#eee0db}.preview{padding:12px;background:#ece7e1;min-height:340px;overflow:hidden}.preview>*{margin:0 auto!important}.status{position:fixed;bottom:14px;right:14px;background:#5e7060;color:white;border-radius:9px;padding:10px 16px;box-shadow:0 8px 30px #0002;font-size:12px;display:none;z-index:99}.status.show{display:block}@media(max-width:850px){.gallery{grid-template-columns:1fr}.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.inputs{grid-template-columns:1fr}.inputs .wide{grid-column:auto}.preview{padding:5px}.design-head{padding:11px}.design-actions button{font-size:10px;padding:7px}h1{font-size:23px}}
</style></head><body>
<header><div><div><h1>✿ Little Home · Gallery Vol. 2</h1><p>กรอบหรูอีก 4 สไตล์ · เปลี่ยนข้อมูลแล้วดูพรีวิว · คัดลอก HTML ได้ทันที</p></div><a class="back" href="home-location-gallery.html">↖ ดู Vol. 1</a></div></header>
<div class="container"><section class="settings"><h2>01 / ปรับข้อมูลสำหรับทุกตัวอย่าง</h2><div class="inputs">
<label>ชื่อห้องภาษาอังกฤษ<input id="room" value="The Bedroom"></label>
<label>ชื่อห้องภาษาไทย<input id="thai" value="ห้องนอน · พื้นที่ส่วนตัว"></label>
<label>ชั้น / ตำแหน่ง<input id="floor" value="SECOND FLOOR"></label>
<label>รูปห้อง (URL)<input id="mainImage" value="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1000&q=85"></label>
<label class="wide">รูปพื้นหลังสวน/หญ้า (URL)<input id="bgImage" value="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1200&q=85"></label>
<label>เลขห้อง<input id="number" value="01"></label>
<label class="wide">คำบรรยาย<textarea id="description">ห้องนอนขนาดกำลังดีที่เปิดรับแสงแดดอ่อน ๆ ในตอนเช้า ม่านสีครีมไหวตามลม มีแจกันดอกไม้เล็ก ๆ อยู่ข้างเตียง และมุมอ่านหนังสือที่เงียบสงบ เหมาะกับการใช้เวลาส่วนตัว</textarea></label>
<label>หมายเหตุ<textarea id="note">บรรยากาศอบอุ่น เป็นส่วนตัว และมีกลิ่นหอมจาง ๆ ของดอกไม้</textarea></label>
</div><p class="note">รูปภาพเป็นตัวอย่างออนไลน์ เปลี่ยนเป็น URL รูปของตัวเองได้ · ทุกปุ่ม “คัดลอกโค้ด” จะได้ HTML พร้อม CSS ของดีไซน์นั้น ๆ</p></section>
<div class="gallery" id="gallery"></div></div><div class="status" id="status" role="status"></div>
<script>
'use strict';
const $=x=>document.getElementById(x);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const safeUrl=s=>/^https:\/\/[^\s"'<>]+$/i.test(String(s).trim())?String(s).trim():'';
const fields=['room','thai','floor','mainImage','bgImage','number','description','note'];
const data=()=>Object.fromEntries(fields.map(x=>[x,esc($(x).value)]));
const photo=s=>safeUrl(s)||'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1000';
const garden=s=>safeUrl(s)||'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1200';
const css="\n/* Location Gallery Vol.2 : four light, self-contained luxury cards */\n.lv5,.lv6,.lv7,.lv8{box-sizing:border-box;max-width:590px;width:100%;font-family:Georgia,'Noto Serif Thai',serif;color:#615f58;overflow:hidden}\n.lv5 *,.lv6 *,.lv7 *,.lv8 *{box-sizing:border-box}\n.lv5{padding:19px;background-position:center;background-size:cover;border:1px solid #d4dccc;border-radius:20px;box-shadow:0 13px 32px #4b664c24;transition:box-shadow .35s ease}\n.lv5 .glass{padding:21px;background:rgba(255,254,250,.90);border:1px solid #ffffffdd;border-radius:15px;box-shadow:0 7px 24px #3f593219}\n.lv5 .top,.lv6 .top,.lv7 .top,.lv8 .top{font:600 10px/1.5 Arial,sans-serif;letter-spacing:2px;color:#a17e88}\n.lv5 .heading{display:flex;justify-content:space-between;align-items:end;gap:8px;flex-wrap:wrap;margin:10px 0 17px}\n.lv5 h2{margin:0;color:#5f715d;font:500 clamp(27px,5vw,41px)/1.15 Georgia,serif}\n.lv5 .floor{color:#9b8c85;font:10px Arial,sans-serif;letter-spacing:1px}\n.lv5 .pic{position:relative;border-radius:10px;overflow:hidden;border:4px solid #fff;box-shadow:0 5px 17px #6a725327}\n.lv5 img{width:100%;height:220px;display:block;object-fit:cover;transition:transform 1s ease}\n.lv5 .petal{position:absolute;right:13px;top:6px;color:#fdf9ef;font:29px Georgia,serif;text-shadow:0 1px 10px #2c4728aa}\n.lv5 .thai{color:#a4828d;font:italic 14px/1.8 Georgia,'Noto Serif Thai',serif;margin:16px 0 4px}\n.lv5 .desc{font:13px/1.95 'Noto Serif Thai',serif;color:#6e7069}\n.lv5 .bottom{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #d6dacf;margin-top:17px;padding-top:13px;color:#90847e;font:10px Arial,sans-serif;letter-spacing:1.1px}\n.lv5:hover{box-shadow:0 18px 38px #4b664c35}.lv5:hover img{transform:scale(1.025)}\n.lv6{position:relative;border:1px solid #dacfc2;background:#fffaf1;padding:21px;box-shadow:0 11px 28px #66594d22}\n.lv6:before{content:\"\";position:absolute;inset:10px;border:1px solid #ddd1c1;pointer-events:none}\n.lv6 .inner{position:relative;padding:17px 18px 10px;text-align:center}\n.lv6 .seal{margin:4px auto 10px;color:#b4958d;font:30px/1 Georgia,serif}\n.lv6 .top{color:#b29689}\n.lv6 h2{font:500 clamp(30px,6vw,45px)/1.13 Georgia,serif;color:#75645f;margin:10px 0 4px}\n.lv6 .thai{font:italic 14px/1.65 Georgia,'Noto Serif Thai',serif;color:#ac8a92}\n.lv6 .rule{display:flex;align-items:center;gap:12px;justify-content:center;color:#c1a89b;font-size:12px;margin:15px 0}\n.lv6 .rule:before,.lv6 .rule:after{content:\"\";height:1px;flex:1;background:#d9c8bc}\n.lv6 img{width:100%;height:225px;object-fit:cover;display:block;border:5px solid #fff;box-shadow:0 4px 14px #6c605c26}\n.lv6 .desc{text-align:left;font:13px/1.95 'Noto Serif Thai',serif;color:#766e68;margin-top:16px}\n.lv6 .bottom{margin-top:16px;color:#a48d82;letter-spacing:2px;font:10px Arial,sans-serif}\n.lv6 .rule span{display:inline-block;transition:transform .3s ease}.lv6:hover .rule span{transform:rotate(20deg)}\n.lv7{background:#e9eee6;border:1px solid #c8d4c4;padding:12px;box-shadow:0 14px 30px #3d59371d;border-radius:11px}\n.lv7 .frame{background:#fbfbf6;border:7px solid #fafcf8;box-shadow:0 3px 13px #78907924}\n.lv7 .photo{position:relative;overflow:hidden;height:235px}\n.lv7 .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease}\n.lv7:hover .photo img{transform:scale(1.035)}\n.lv7 .window-arch{position:absolute;inset:15px;border:1px solid #ffffffb9;border-radius:120px 120px 0 0;pointer-events:none}\n.lv7 .card{position:relative;background:#fffefa;margin:-28px 24px 16px;padding:18px 20px;border:1px solid #dfdfd6;box-shadow:0 8px 22px #73887220}\n.lv7 .card .top{color:#8c9e83}.lv7 h2{font:500 clamp(27px,6vw,42px)/1.2 Georgia,serif;color:#5c725d;margin:8px 0 3px}.lv7 .thai{color:#b18e98;font:italic 13px/1.7 Georgia,'Noto Serif Thai',serif}.lv7 .desc{border-top:1px solid #e5e6dd;margin-top:14px;padding-top:12px;font:13px/1.95 'Noto Serif Thai',serif;color:#74776c}.lv7 .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px;color:#8e9a89;font:10px Arial,sans-serif;letter-spacing:1px}\n.lv8{position:relative;border:1px solid #e2cfce;border-radius:20px;background:#fdf9f8;padding:19px;box-shadow:0 12px 29px #88696821;transition:transform .3s ease,box-shadow .3s ease}\n.lv8 .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#ae8b94;font:600 10px/1.6 Arial,sans-serif;letter-spacing:1.5px;border-bottom:1px solid #eddddc;padding-bottom:12px}\n.lv8 .content{display:grid;grid-template-columns:42% 1fr;gap:18px;align-items:center;margin-top:20px}\n.lv8 .photo{position:relative;padding:5px 5px 5px 0}\n.lv8 .photo img{width:100%;height:270px;object-fit:cover;border-radius:110px 110px 6px 6px;border:6px solid #fff;box-shadow:0 6px 20px #9f7c7427}\n.lv8 .photo .blossom{position:absolute;bottom:-9px;left:-3px;font:36px Georgia,serif;color:#b5bfa9;text-shadow:0 2px 3px #fff}\n.lv8 .flower{font:28px Georgia,serif;color:#b0bba0;margin:0 0 10px}\n.lv8 h2{margin:0 0 8px;font:500 clamp(24px,5vw,38px)/1.2 Georgia,serif;color:#806e6c}\n.lv8 .thai{font:italic 13px/1.7 Georgia,'Noto Serif Thai',serif;color:#ac8992}\n.lv8 .desc{font:13px/1.95 'Noto Serif Thai',serif;color:#79706f;margin-top:13px}\n.lv8 .note{margin-top:19px;padding:11px 14px;background:#f3eee9;color:#867c73;border-left:2px solid #b5bda9;font:12px/1.8 'Noto Serif Thai',serif}\n.lv8 .foot{text-align:right;margin-top:14px;color:#aa8d94;font:10px Arial,sans-serif;letter-spacing:1.5px}\n.lv8:hover{transform:translateY(-3px);box-shadow:0 17px 30px #88696825}\n@media(max-width:480px){.lv5{padding:9px}.lv5 .glass{padding:14px}.lv6{padding:12px}.lv6 .inner{padding:14px 13px}.lv7 .card{margin-left:11px;margin-right:11px}.lv8 .content{grid-template-columns:1fr;gap:8px}.lv8 .photo img{height:230px}.lv8{padding:13px}}\n@media(prefers-reduced-motion:reduce){.lv5,.lv5 img,.lv6 .rule span,.lv7 img,.lv8{transition:none!important}.lv5:hover img,.lv7:hover .photo img{transform:none}.lv8:hover{transform:none}}\n";
function make(i,d){
 const r=d.room,t=d.thai,f=d.floor,num=d.number,desc=d.description,n=d.note,p=photo($('mainImage').value),bg=garden($('bgImage').value);
 if(i===1)return '<div class="lv5" style="background-image:linear-gradient(135deg,#eaf1e4a8,#fffaf4aa),url(&quot;'+esc(bg)+'&quot;)"><div class="glass"><div class="top">✿ THE GARDEN RESIDENCE / '+num+'</div><div class="heading"><h2>'+r+'</h2><span class="floor">'+f+'</span></div><div class="pic"><img alt="room" src="'+esc(p)+'"><span class="petal">✧</span></div><div class="thai">'+t+'</div><div class="desc">'+desc+'</div><div class="bottom"><span>❀ HOME COLLECTION</span><span>PRIVATE · '+num+'</span></div></div></div>';
 if(i===2)return '<div class="lv6"><div class="inner"><div class="seal">❦</div><div class="top">THE IVORY MANOR / ROOM '+num+'</div><h2>'+r+'</h2><div class="thai">'+t+'</div><div class="rule"><span>✦</span></div><img alt="room" src="'+esc(p)+'"><div class="desc">'+desc+'</div><div class="bottom">'+f+' · A ROOM TO REMEMBER</div></div></div>';
 if(i===3)return '<div class="lv7"><div class="frame"><div class="photo"><img alt="garden background" src="'+esc(bg)+'"><div class="window-arch"></div></div><div class="card"><div class="top">BOTANICAL WINDOW / '+num+'</div><h2>'+r+'</h2><div class="thai">'+t+'</div><div class="desc">'+desc+'</div><div class="meta"><span>✿ '+f+'</span><span>HOUSE ARCHIVE</span></div></div></div></div>';
 return '<div class="lv8"><div class="head"><span>✿ SOFT ROSE COTTAGE</span><span>ROOM '+num+' / '+f+'</span></div><div class="content"><div class="photo"><img alt="room" src="'+esc(p)+'"><span class="blossom">❀</span></div><div><div class="flower">✳</div><h2>'+r+'</h2><div class="thai">'+t+'</div><div class="desc">'+desc+'</div></div></div><div class="note">❀ '+n+'</div><div class="foot">A LITTLE LETTER FROM HOME</div></div>';
}
const options=[['Glass Garden Luxe','สวนจริงกับกระจกฝ้าละมุน · เงาเบา ๆ'],['Ivory Manor Label','ป้ายห้องแบบคฤหาสน์ · งาช้างและทองหม่น'],['Botanical Window Archive','หน้าต่างสวนสีเสจ · รูปขยายเล็กน้อยเมื่อชี้'],['Soft Rose Cottage','ดอกไม้ชมพูหม่น · รูปซุ้มโค้งแบบนุ่มนวล']];
function snippet(i){const rules=css;return '<style>'+rules+'</style>'+make(i,data())}
function update(){document.querySelectorAll('.preview').forEach(el=>{const i=Number(el.dataset.design);el.innerHTML=snippet(i)})}
function notice(msg){const s=$('status');s.textContent=msg;s.classList.add('show');clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>s.classList.remove('show'),2200)}
async function copy(i){const t=snippet(i).replace(/\n/g,'');try{await navigator.clipboard.writeText(t);notice('✓ คัดลอกโค้ดแบบ '+(i+4)+' แล้ว')}catch(e){const textarea=document.createElement('textarea');textarea.value=t;document.body.appendChild(textarea);textarea.select();document.execCommand('copy');textarea.remove();notice('✓ คัดลอกโค้ดแล้ว')}}
function save(i){const text=snippet(i);const blob=new Blob([text],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='home-location-vol2-style-'+(i+4)+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('ดาวน์โหลด HTML แบบ '+i+' แล้ว')}
const g=$('gallery');options.forEach((row,j)=>{let i=j+1,el=document.createElement('article');el.className='design';el.innerHTML='<div class="design-head"><div><strong>0'+(i+4)+' · '+row[0]+'</strong><small>'+row[1]+'</small></div><div class="design-actions"><button type="button" data-copy="'+i+'">คัดลอกโค้ด</button><button type="button" data-save="'+i+'">โหลด .html</button></div></div><div class="preview" data-design="'+i+'"></div>';g.appendChild(el)});
g.addEventListener('click',e=>{const a=e.target.closest('[data-copy]'),b=e.target.closest('[data-save]');if(a)copy(Number(a.dataset.copy));if(b)save(Number(b.dataset.save))});
fields.forEach(id=>$(id).addEventListener('input',update));update();
</script></body></html>
