<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RP Luxury Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#252321;color:#ddd;font-family:"Noto Sans Thai",sans-serif}.app{width:min(1380px,96vw);margin:25px auto;display:grid;grid-template-columns:390px 1fr;gap:20px}.panel,.preview{background:#151515;border:1px solid #3a3835;border-radius:12px}.panel{padding:22px}.brand{font:600 27px "Cormorant Garamond";letter-spacing:.04em}.sub{font-size:9px;letter-spacing:.18em;color:#888;text-transform:uppercase;margin:3px 0 20px}.group{margin:15px 0}.group label{display:block;font-size:11px;color:#aaa;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select{width:100%;border:1px solid #444;background:#202020;color:#eee;border-radius:7px;padding:9px;font:12px "Noto Sans Thai"}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:1px solid #555;background:#eee;color:#222;padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:600}button.secondary{background:#292929;color:#ddd}.code{margin-top:14px;background:#0d0d0d;border:1px solid #333;border-radius:7px;padding:10px;font:10px/1.5 monospace;word-break:break-all;color:#bbb;min-height:44px}.preview{padding:20px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}.paper{width:min(760px,100%);background:#eeeae4;color:#292929;padding:28px 38px 30px;box-shadow:0 12px 35px #0004;transition:.2s}.top{display:flex;justify-content:space-between;border-bottom:1px solid #b9afa3;padding-bottom:10px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#777067}.identity{display:grid;grid-template-columns:1fr 205px;gap:28px;align-items:end;padding:25px 0 28px}.name{font:600 clamp(50px,6vw,74px)/.72 "Cormorant Garamond";letter-spacing:-.025em}.surname{font:500 27px/1 "Cormorant Garamond";color:#777067;margin-top:14px}.motto{font-size:10px;line-height:1.7;color:#777067}.photos{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-left:4%;width:92%}.photo{height:330px;overflow:hidden;position:relative;border:1px solid #c7beb3;box-shadow:7px 9px 0 #66554418,0 12px 25px #0002}.photo:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.28);pointer-events:none;z-index:2}.photo.second{height:318px;margin-top:28px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.divider{height:1px;background:#b9afa3;margin:30px 0 0}.rp{margin-top:22px;background:#e0d8ce;padding:24px 28px 22px;font-size:13px;line-height:2;color:#292929;border-left:1px solid #a98e6e;border-right:1px solid #a98e6e}.rp p{margin:0 0 17px}.rp p:last-child{margin:0}.note{display:grid;grid-template-columns:55px 1fr;gap:20px;align-items:start;margin-top:22px;padding:13px 0;border-top:1px solid #b9afa3;border-bottom:1px solid #b9afa3}.note b{font-size:8px;letter-spacing:.18em;min-width:55px;color:#777067}.note span{font-size:10px;line-height:1.8;color:#777067}.foot{margin-top:20px;font-size:8px;letter-spacing:.15em;color:#777067}
.dark .paper{background:#202020;color:#eee}.gold .paper{background:#171614;color:#eee}.gold .top,.gold .motto,.gold .surname,.gold .note b,.gold .note span,.gold .foot{color:#b9a06b}.gold .top,.gold .divider,.gold .note{border-color:#655536}.gold .photo{border-color:#7d6940;box-shadow:7px 9px 0 #0008,0 12px 25px #0009}.gold .rp{background:#211f1a;color:#eee;border-color:#b79a62}.gold .rp p{color:#eee}.gold .name{color:#f1e7cf}.dark .top,.dark .motto,.dark .surname,.dark .note b,.dark .note span,.dark .foot{color:#aaa}.dark .top,.dark .divider,.dark .note{border-color:#555}.dark .photo{border-color:#666;box-shadow:7px 9px 0 #0006,0 12px 25px #0008}.dark .rp{background:#292929;color:#eee;border-color:#777}.dark .rp p{color:#eee}
@media(max-width:950px){.app{grid-template-columns:1fr}.preview{order:2}.panel{order:1}.identity{grid-template-columns:1fr}.motto{margin-top:15px}.photos{margin-left:0;width:100%}}
@media(max-width:560px){.panel{padding:16px}.paper{padding:22px 18px}.photos{gap:9px}.photo{height:220px}.photo.second{height:210px;margin-top:12px}}
</style></head>
<body><div class="app">
<section class="panel"><div class="brand">RP Luxury</div><div class="sub">Private Archive Generator</div>
<div class="group"><label>โทนสี</label><select id="theme"><option value="light">LIGHT · ขาว / ครีม</option><option value="dark">DARK · ดำ / ขาว</option><option value="gold">BLACK & GOLD · ดำ / ทอง</option></select></div>
<div class="group row"><div><label>รูปที่ 1</label><input id="p" placeholder="URL รูปภาพ"></div><div><label>รูปที่ 2</label><input id="p2" placeholder="URL รูปภาพ"></div></div>
<div class="group row"><div><label>ชื่อ</label><input id="name" value="TRISTIAN"></div><div><label>นามสกุล</label><input id="sur" value="Sidney Kennedy"></div></div>
<div class="group"><label>คำโปรย</label><input id="motto" value="A private record of a character, written between memory, silence and quiet moments."></div>
<div class="group"><label>ข้อความ RP · แยกย่อหน้าด้วย |</label><textarea id="rp">ทริสเตียนยืนนิ่งอยู่ครู่หนึ่ง ปล่อยให้ความเงียบรอบตัวค่อย ๆ จางลง ก่อนจะหันกลับมามองอีกฝ่ายด้วยรอยยิ้มบาง ๆ</textarea></div>
<div class="group"><label>Note</label><input id="note" value="รายละเอียดเล็ก ๆ ค่อย ๆ ปรากฏขึ้นระหว่างการโรล"></div>
<div class="actions"><button onclick="generate()">Generate Code</button><button class="secondary" onclick="copyCode()">Copy Code</button><button class="secondary" onclick="resetForm()">Reset</button></div><div class="code" id="code">กด Generate Code เพื่อสร้างโค้ดสั้น</div></section>
<section class="preview"><div class="paper" id="preview"></div></section>
</div>
<script>
const ids=['theme','p','p2','name','sur','motto','rp','note'];const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function render(){const theme=$('theme').value;document.body.classList.toggle('dark',theme==='dark');document.body.classList.toggle('gold',theme==='gold');const p=$('p').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg';const p2=$('p2').value||p;const paras=$('rp').value.split('|').filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');$('preview').innerHTML='<div class="top"><span>Private Archive / Character File</span><span>2026</span></div><section class="identity"><div><div class="name">'+esc($('name').value)+'</div><div class="surname">'+esc($('sur').value)+'</div></div><div class="motto">'+esc($('motto').value)+'</div></section><section class="photos"><div class="photo"><img src="'+esc(p)+'"></div><div class="photo second"><img src="'+esc(p2)+'"></div></section><div class="divider"></div><article class="rp">'+paras+'</article><section class="note"><b>NOTE</b><span>'+esc($('note').value)+'</span></section><div class="foot">'+esc($('name').value)+' / Personal Archive</div>'}
function generate(){const u=new URL('https://smemories145-cpu.github.io/Tristianloveyou/rp-luxury.html');ids.forEach(id=>{const v=$(id).value;if(v)u.searchParams.set(id,v)});$('code').textContent='<iframe src="'+u.href+'" style="width:100%;height:1000px;border:0" loading="lazy"></iframe>'}
function copyCode(){if($('code').textContent.startsWith('กด '))generate();navigator.clipboard?.writeText($('code').textContent);$('code').style.outline='1px solid #777';setTimeout(()=>$('code').style.outline='',500)}
function resetForm(){location.reload()}ids.forEach(id=>$(id).addEventListener('input',render));$('theme').addEventListener('change',render);render();
</script></body></html>
