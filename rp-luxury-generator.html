<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RP Luxury Generator</title><style>body{font-family:Arial,sans-serif;background:#eee;margin:0;padding:25px;color:#222}.box{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:14px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}textarea{min-height:100px}button{margin-top:15px;padding:11px 16px;border:0;border-radius:8px;cursor:pointer}#out{margin-top:15px;background:#f5f5f5;padding:12px;word-break:break-all;font-family:monospace;font-size:12px}</style></head><body><div class="box"><h2>RP Luxury Generator</h2><label>โทนสี</label><select id="theme"><option value="light">ขาว / ครีม</option><option value="dark">ดำ / ขาว</option></select><label>รูปที่ 1</label><input id="p" placeholder="URL รูปภาพ"><label>รูปที่ 2</label><input id="p2" placeholder="URL รูปภาพ (เว้นว่างได้)"><label>ชื่อ</label><input id="name" value="TRISTIAN"><label>นามสกุล</label><input id="sur" value="Sidney Kennedy"><label>คำโปรย</label><input id="motto"><label>ข้อความโรล</label><textarea id="rp" placeholder="แยกแต่ละย่อหน้าด้วย |"></textarea><label>Note</label><input id="note"><button onclick="make()">สร้างโค้ดสั้น</button><div id="out"></div><script>function make(){const ids=['theme','p','p2','name','sur','motto','rp','note'],u=new URL('https://smemories145-cpu.github.io/Tristianloveyou/rp-luxury.html');ids.forEach(id=>{const v=document.getElementById(id).value;if(v)u.searchParams.set(id,v)});document.getElementById('out').textContent='<iframe src="'+u.href+'" style="width:100%;height:1000px;border:0" loading="lazy"></iframe>'}</script></div></body></html>
