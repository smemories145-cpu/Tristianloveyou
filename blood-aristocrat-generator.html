<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood Aristocrat Generator</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#090708;color:#eee8df;font-family:"Noto Serif Thai",serif}.gen{width:min(1180px,96%);margin:20px auto;display:grid;grid-template-columns:350px 1fr;gap:18px}.panel,.stage{background:#111;border:1px solid #8f1f2940;box-shadow:0 18px 45px #0009}.panel{padding:20px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}.stage{padding:18px;min-height:780px}.title{font:30px "Cormorant Garamond";color:#e9d8c4}.sub,.label,.ver,.btn{font-family:"DM Mono"}.sub{font-size:8px;color:#766b64}.label{font-size:8px;letter-spacing:.16em;color:#b99a6b;margin:14px 0 6px}.input,.select,.ta{width:100%;border:1px solid #ffffff18;background:#090708;color:#e8ded4;padding:9px 10px;border-radius:2px;outline:none;font:11px "Noto Serif Thai"}.ta{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.range{width:100%;accent-color:#a92e37}.rangeval{float:right;color:#81756d}.ver,.btn{display:block;width:100%;padding:9px 10px;margin:6px 0;border:1px solid #ffffff16;background:#0b090a;color:#cfc4b8;text-align:left;cursor:pointer;font-size:8px;letter-spacing:.08em}.ver.active{border-color:#b99a6b88;background:#241012;color:#e7cda9}.btn{background:#241014;text-align:center}.out{margin-top:8px;width:100%;height:150px;background:#070607;color:#aaa;border:1px solid #ffffff15;padding:9px;font:9px monospace;resize:vertical}.count{font:8px "DM Mono";color:#746b65;text-align:right;margin-top:4px}.preview{max-width:700px;margin:auto}.ba{--r:#8f1f29;--r2:#c44c55;--g:#b99a6b;position:relative;width:100%;min-height:720px;padd ><option>Noto Serif Thai</option><option>Prompt</option><option>Kanit</option><option>Sarabun</option></select><div class="label">RP SIZE <span id="sv" class="rangeval">16px</span></div><input id="size" class="range" type="range" min="12" max="20" value="16"><div class="label">PHOTO HEIGHT <span id="hv" class="rangeval">420px</span></div><input id="height" class="range" type="range" min="300" max="520" value="420"><div class="label">PHOTO ZOOM <span id="zv" class="rangeval">1.00</span></div><input id="zoom" class="range" type="range" min="1" max="1.25" step=".01" value="1"><div class="label">ROLEPLAY</div><textarea id="rp" class="ta">ช่วงบ่ายของวันมาถึงแล้ว ทริสเตียนลุกขึ้นจากเตียงเพื่อมาสวมเสื้อคลุมสีดำปกปิดทั้งตัว ก่อนจะขับรถออกไปยังชายป่าเพื่อเก็บสมุนไพร ระหว่างทางสายตากลับสะดุดเข้ากับเห็ดหน้าตาประหลาด “เห็ดสีอะไรเนี่ย?”</textarea><div id="count" class="count">0 คำ</div><div class="label">NOTE</div><input id="note" class="input" value="หมายเหตุ herb + หาเห็ด"><div class="btns"><button id="generate" class="btn">GENERATE CODE</button><button id="copy" class="btn">COPY CODE</button></div><textarea id="out" class="out" readonly></textarea></section><section class="stage"><div id="preview" class="preview"></div></section></div><script>

gn:center;font:10px "DM Mono";color:#c8bdb1}.ba-meta span+span{border-left:1px solid #a92e3725}.ba-meta b{display:block;font-size:7px;color:var(--r2);margin-bottom:4px}.ba-rp{width:72%;margin:24px auto 0;padding:18px 20px;background:#070506d9;border:1px solid var(--g);line-height:2.05}.ba-rp-head{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #a92e3730;font:7px "DM Mono";letter-spacing:.18em;color:var(--r2)}.ba-rp p{margin:0 0 12px}.ba-note{padding-top:10px;border-top:1px solid #b99a6b25;color:#968a80;font-size:10px}.ba-note b{font:7px "DM Mono";color:var(--g);margin-right:10px}.ba-foot{text-align:center;margin-top:22px;font:7px "DM Mono";letter-spacing:.22em;color:#695c56}@keyframes glow{0%,100%{text-shadow:0 0 4px #fff4,0 0 12px var(--r),0 0 25px var(--r)}50%{text-shadow:0 0 6px #fff8,0 0 16px var(--r2),0 0 40px var(--r2),0 0 60px var(--r)}}@media(max-width:560px){.ba-photo,.ba-meta,.ba-rp{width:88%}.ba-name h1{font-size:59px}}</style><div class="ba" style="background-image:linear-gradient(180deg,#05030345,#080304a8 45%,#050303f5 100%),url(\''+esc(d.bg)+'\')"><div class="ba-head"><span>PRIVATE COLLECTION</span><i>✦</i><span>TRIS · XVII</span></div><div class="ba-photo"><img src="'+esc(d.photo)+'"></div><div class="ba-name"><small>'+esc(d.kicker)+'</small><h1>'+esc(d.name)+'</h1><h2>'+esc(d.surname)+'</h2><em>'+esc(d.motto)+'</em></div><div class="ba-meta"><span><b>BORN</b>'+esc(d.birth)+'</span><span><b>TYPE</b>'+esc(d.type)+'</span><span><b>STATUS</b>'+esc(d.status)+'</span></div><div class="ba-rp" style="font-family:\''+esc(d.font)+'\',serif;font-size:'+d.size+'px"><div class="ba-rp-head">SCENE / PRIVATE RECORD</div>'+paras+'<div class="ba-note"><b>NOTE /</b>'+esc(d.note)+'</div></div><div class="ba-foot">A PRIVATE COLLECTION · TSK</div></div>'}
document.querySelectorAll(".ver").forEach(function(b){b.onclick=function(){document.querySelectorAll(".ver").forEach(function(x){x.classList.remove("active")});b.classList.add("active");version=+b.dataset.v;render()}});document.querySelectorAll("input,textarea,select").forEach(function(x){x.addEventListener("input",render)});$("generate").onclick=function(){$("out").value=output()};$("copy").onclick=function(){var v=$("out").value||output();$("out").value=v;if(navigator.clipboard)navigator.clipboard.writeText(v)};render();
