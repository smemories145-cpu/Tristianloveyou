<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Old Cinema Roleplay Generator</title><link rel="stylesheet" href="./cinema-role.css?v=3"><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500&family=Montserrat:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500&family=Noto+Serif+Thai:wght@300;400;500&family=Playfair+Display:wght@400;500;600&family=Sarabun:wght@400;500&display=swap');*{box-sizing:border-box}body{margin:0;background:#090d0f;color:#ddd;font-family:"Noto Sans Thai",Montserrat,sans-serif}.app{display:grid;grid-template-columns:380px minmax(0,1fr);gap:22px;min-height:100vh;padding:22px}.panel{position:sticky;top:22px;height:calc(100vh - 44px);overflow:auto;background:#121617;border:1px solid #2a3031;border-radius:14px;padding:20px;box-shadow:0 15px 40px #0008}.panel h1{margin:0 0 5px;font:600 25px Georgia,serif;letter-spacing:1px}.sub{font-size:11px;color:#8d9290;margin-bottom:18px}.field{margin:13px 0}.field label{display:block;font-size:11px;color:#aeb3b0;margin-bottom:6px}.field input[type=text],.field textarea,.field select{width:100%;background:#0b0f10;color:#eee;border:1px solid #303536;border-radius:8px;padding:10px;font:13px "Noto Sans Thai",sans-serif;outline:0}.toolbar{display:flex;gap:5px;flex-wrap:wrap;background:#0b0f10;border:1px solid #303536;border-radius:8px;padding:6px}.toolbar button,.btn{border:1px solid #39403f;background:#171c1d;color:#dce0dd;border-radius:6px;padding:7px 9px;cursor:pointer}.toolbar button:hover,.btn:hover{background:#222829}.row{display:grid;grid-template-columns:1fr;gap:0}.range{display:flex;align-items:center;gap:8px}.range input{width:100%}.range span{width:48px;text-align:right;font-size:11px;color:#9aa09d}.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{display:flex;align-items:center;gap:8px;font-size:10px;color:#aeb3b0}.color input{width:34px;height:28px;padding:0;border:0;background:none}.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;background:#0b0f10;border:1px solid #303536;border-radius:8px;font-size:11px;color:#aeb3b0}.toggle input{accent-color:#b9b0a4}.count{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;color:#71807c;font-size:9px;letter-spacing:1px}.count b{color:#c8beb0;font-weight:500}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.primary{background:#c8beb0!important;color:#171515!important;border-color:#c8beb0!important}.out{margin-top:14px;width:100%;height:120px;background:#0b0f10;color:#aeb3b0;border:1px solid #303536;border-radius:8px;padding:9px;font:11px monospace}.preview{min-width:0;padding:25px;background:#0d1112;border:1px solid #222829;border-radius:14px;overflow:auto}.preview-head{font-size:10px;letter-spacing:3px;color:#7f8784;margin:0 0 12px}.hint{font-size:10px;color:#65706d;text-align:center;margin-top:12px}.preview .cinema{margin:0 auto}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:relative;top:0;height:auto}.preview{padding:10px}}</style></head><body><div class="app"><aside class="panel"><h1>OLD CINEMA</h1><div class="sub">Film Archive Roleplay Generator · ปรับได้ละเอียดขึ้นและพร้อมใส่โรล</div><div class="field"><label>รูปตัวละคร</label><input id="img" type="text" placeholder="https://...jpg"><input id="imgFile" type="file" accept="image/*" style="width:100%;margin-top:7px;color:#9da4a1;font-size:11px"></div><div class="row"><div class="field"><label>ความกว้างรูป</label><div class="range"><input id="imgW" type="range" min="180" max="700" value="440"><span id="imgWV">440px</span></div></div><div class="field"><label>ความสูงรูป</label><div class="range"><input id="imgH" type="range" min="160" max="500" value="310"><span id="imgHV">310px</span></div></div></div><div class="row"><div class="field"><label>ซูมรูป</label><div class="range"><input id="imgZoom" type="range" min="100" max="160" value="100"><span id="imgZoomV">100%</span></div></div><div class="field"><label>เลื่อนแนวนอน</label><div class="range"><input id="imgX" type="range" min="-25" max="25" value="0"><span id="imgXV">0</span></div></div></div><div class="field"><label>เลื่อนแนวตั้ง</label><div class="range"><input id="imgY" type="range" min="-25" max="25" value="0"><span id="imgYV">0</span></div></div><div class="field"><div class="toggle"><span>ฟิลเตอร์ภาพขาวดำ</span><input id="filter" type="checkbox" checked></div></div><div class="row"><div class="field" style="margin-top:8px"><label>โทนสี</label><select id="theme"><option value="noir">NOIR · ดำคลาสสิก</option><option value="ivory">IVORY · ขาวครีม</option><option value="mocha">MOCHA · น้ำตาลวินเทจ</option><option value="burgundy">BURGUNDY · แดงไวน์</option><option value="forest">FOREST · เขียวเข้ม</option><option value="blue">MIDNIGHT BLUE · น้ำเงินหม่น</option><option value="rose">DUSTY ROSE · ชมพูกุหลาบ</option><option value="plum">PLUM · ม่วงพลัม</option></select></div><div class="row"><div class="field"><label>SCENE</label><input id="scene" type="text" value="SCENE 07"></div><div class="field"><label>TAKE</label><input id="take" type="text" value="TAKE 01"></div></div><div class="field"><label>คำโปรย</label><input id="tagline" type="text" value="THE MAN WHO NEVER SLEEPS"></div><div class="field"><label>ชื่อ</label><input id="title" type="text" value="TRISTIAN"></div><div class="field"><label>ชื่อรอง</label><input id="credit" type="text" value="SIDNEY KENNEDY · CHARACTER ARCHIVE"></div><div class="row"><div class="field"><label>ฟอนต์ชื่อ</label><select id="titleFont"><option value="'Playfair Display',serif">Playfair Display</option><option value="'Cormorant Garamond',serif">Cormorant Garamond</option><option value="Georgia,serif">Georgia</option><option value="'Montserrat',sans-serif">Montserrat</option></select></div><div class="field"><label>ขนาดชื่อ</label><div class="range"><input id="titleSize" type="range" min="28" max="64" value="45"><span id="titleSizeV">45px</span></div></div></div><div class="field"><label>ข้อความโรลเพลย์</label><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><button data-cmd="justifyLeft">≡←</button><button data-cmd="justifyCenter">≡</button><button data-cmd="justifyRight">→≡</button><button data-cmd="justifyFull">☰</button></div><div id="role" contenteditable="true" style="min-height:145px;background:#0b0f10;border:1px solid #303536;border-top:0;border-radius:0 0 8px 8px;padding:10px;font-size:13px;line-height:1.9;outline:0;text-align:justify">ใส่ข้อความโรลเพลย์ตรงนี้</div><div class="count"><span>WORDS · <b id="wordCount">0</b></span><span>CHARACTERS · <b id="charCount">0</b></span></div></div><div class="row"><div class="field"><label>ฟอนต์โรล</label><select id="roleFont"><option value="'Noto Serif Thai',serif">Noto Serif Thai</option><option value="'Sarabun',sans-serif">Sarabun</option><option value="'IBM Plex Sans Thai',sans-serif">IBM Plex Sans Thai</option><option value="'Noto Sans Thai',sans-serif">Noto Sans Thai</option><option value="'Playfair Display',serif">Playfair Display</option><option value="'Cormorant Garamond',serif">Cormorant Garamond</option><option value="Georgia,serif">Georgia</option></select></div><div class="field"><label>ขนาดตัวอักษรโรล</label><div class="range"><input id="fontSize" type="range" min="11" max="20" value="12"><span id="fontSizeV">12px</span></div></div></div><div class="row"><div class="field"><label>ความสูงบรรทัด</label><div class="range"><input id="lineHeight" type="range" min="14" max="28" value="20"><span id="lineHeightV">2.0</span></div></div><div class="field"><label>ระยะตัวอักษร</label><div class="range"><input id="letterSpace" type="range" min="0" max="5" value="0"><span id="letterSpaceV">0px</span></div></div></div><div class="field"><label>สีตัวอักษรโรล</label><div class="color"><input id="rollC" type="color" value="#aaa49b"><span id="rollCV">#aaa49b</span></div></div><div class="field"><label>Note</label><input id="note" type="text" value="ตอบกลับช้าบ้างนะครับ 𓂃 ࣪˖"></div><div class="field"><label>Footer</label><input id="footer" type="text" value="A PRIVATE FILM · TSK"></div><div class="actions"><button class="btn primary" id="gen">GENERATE CODE</button><button class="btn" id="clear">CLEAR</button></div><textarea class="out" id="out" readonly placeholder="โค้ดจะขึ้นตรงนี้..."></textarea><button class="btn" id="copy" style="width:100%;margin-top:8px">COPY CODE</button></aside><main class="preview"><div class="preview-head">LIVE PREVIEW</div><div id="preview"></div><div class="hint">Generate แล้วค่าที่ปรับทั้งหมดจะติดไปกับโค้ดที่นำไปใช้</div></main></div><script>const $=id=>document.getElementById(id),themes={noir:["#111","#181716","#eee","#858078","#eeeae3","#706b64","rgba(170,164,155,.45)","#050505"],ivory:["#e9e4da","#f5f1e8","#292723","#777067","#302d28","#716a61","rgba(90,82,72,.35)","#d7d0c4"],mocha:["#241b16","#30231c","#eadbcb","#a98f79","#eadbcb","#9b806a","rgba(190,156,126,.42)","#140d09"],burgundy:["#211215","#2d171b","#f0dfe0","#a9878c","#ead5d8","#a07b81","rgba(185,135,145,.45)","#11090b"],forest:["#101b17","#17251f","#dce8e1","#7f9a8d","#dbe7df","#789085","rgba(130,165,148,.42)","#07100c"],blue:["#101722","#172131","#dbe3ee","#8494a8","#dce5f0","#7f90a6","rgba(132,151,178,.42)","#080d15"],rose:["#21191c","#2d2226","#eee0e3","#aa8e97","#ead9de","#9b7f88","rgba(178,143,155,.42)","#120b0e"],plum:["#19141d","#241b29","#e6ddec","#9887a5","#e4d9eb","#927fa0","rgba(155,132,170,.42)","#0c080f"]},css="https://smemories145-cpu.github.io/Tristianloveyou/cinema-role.css?v=3",stateKey="old-cinema-generator-v2";function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function count(){let t=$("role").innerText.replace(/\u200b/g,"").trim(),w=0;if(t){try{w=[...new Intl.Segmenter("th",{granularity:"word"}).segment(t)].filter(x=>x.isWordLike).length}catch(e){w=t.split(/\s+/).filter(Boolean).length}}$("wordCount").textContent=w;$("charCount").textContent=[...t].length}function imageVars(){return "--cinema-filter:"+($("filter").checked?"grayscale(88%) contrast(1.03)":"none")+";--cinema-zoom:"+($("imgZoom").value/100).toFixed(2)+";--cinema-x:"+$("imgX").value+"%;--cinema-y:"+$("imgY").value+"%;--cinema-photo-w:"+$("imgW").value+"px;--cinema-photo-h:"+$("imgH").value+"px"}function roleVars(){return "--cinema-roll:"+$("rollC").value+";--cinema-size:"+$("fontSize").value+"px;--cinema-role-font:"+$("roleFont").value+";--cinema-line:"+($("lineHeight").value/10).toFixed(1)+";--cinema-letter:"+$("letterSpace").value+"px"}function themeVars(){let t=themes[$("theme").value]||themes.noir;return "--cinema-outer:"+t[0]+";--cinema-film:"+t[1]+";--cinema-main:"+t[2]+";--cinema-muted:"+t[3]+";--cinema-title:"+t[4]+";--cinema-credit:"+t[5]+";--cinema-line:"+t[6]+";--cinema-stripe:"+t[7]+"}function markup(){return "<div class=\"cinema\" style=\""+themeVars()+"\"><div class=\"cinema-film\"><div class=\"cinema-top\"><span>"+esc($("scene").value)+"</span><span>"+esc($("take").value)+"</span></div><img class=\"cinema-photo\" style=\"display:block;width:"+$("imgW").value+"px;max-width:100%;height:"+$("imgH").value+"px;object-fit:cover;"+imageVars()+"\" src=\""+esc($("img").value||"https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg")+"\"><div class=\"cinema-scene\">"+esc($("tagline").value)+"</div><div class=\"cinema-name\" style=\"--cinema-title-font:"+$("titleFont").value+";font-size:"+$("titleSize").value+"px\">"+esc($("title").value)+"</div><div class=\"cinema-credit\">"+esc($("credit").value)+"</div><div class=\"cinema-line\"></div><div class=\"cinema-text\" style=\""+roleVars()+"\">"+$("role").innerHTML+"</div>"+($("note").value?"<div class=\"cinema-note\"><div class=\"cinema-note-label\"><span>NOTE /</span><span>"+esc($("note").value)+"</span></div><span class=\"cinema-note-mark\">✦</span></div>":"")+"<div class=\"cinema-bottom\">"+esc($("footer").value)+"</div></div></div>"}function render(){ $("preview").innerHTML=markup();$("imgWV").textContent=$("imgW").value+"px";$("imgHV").textContent=$("imgH").value+"px";$("imgZoomV").textContent=$("imgZoom").value+"%";$("imgXV").textContent=$("imgX").value;$("imgYV").textContent=$("imgY").value;$("titleSizeV").textContent=$("titleSize").value+"px";$("fontSizeV").textContent=$("fontSize").value+"px";$("lineHeightV").textContent=($("lineHeight").value/10).toFixed(1);$("letterSpaceV").textContent=$("letterSpace").value+"px";$("rollCV").textContent=$("rollC").value;count();let d={};["theme","img","imgW","imgH","imgZoom","imgX","imgY","filter","scene","take","tagline","title","credit","titleFont","titleSize","role","roleFont","fontSize","lineHeight","letterSpace","rollC","note","footer"].forEach(k=>d[k]=$(k).type==="checkbox"?$(k).checked:$(k).value);localStorage.setItem(stateKey,JSON.stringify(d))}document.querySelectorAll("input:not(#imgFile),select").forEach(e=>e.addEventListener("input",render));$("imgFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("img").value=r.result;render()};r.readAsDataURL(f)});$("role").addEventListener("input",render);document.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();document.execCommand(b.dataset.cmd,false,null);$("role").focus();render()}));$("gen").onclick=()=>{$("out").value="<link rel=\"stylesheet\" href=\""+css+"\">"+markup()};$("copy").onclick=async()=>{if(!$("out").value)$("gen").click();await navigator.clipboard.writeText($("out").value);$("copy").textContent="COPIED ✓";setTimeout(()=>$("copy").textContent="COPY CODE",1200)};$("clear").onclick=()=>{localStorage.removeItem(stateKey);location.reload()};try{let d=JSON.parse(localStorage.getItem(stateKey));if(d)Object.keys(d).forEach(k=>{if($(k)&&k!=="imgFile"){if($(k).type==="checkbox")$(k).checked=d[k];else $(k).value=d[k]}})}catch(e){}render();</script></body></html>
