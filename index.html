<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleplay Code Generator</title><link rel="stylesheet" href="https://smemories145-cpu.github.io/Tristianloveyou/roleplay.css"><style>@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Prompt,sans-serif}.app{max-width:1180px;margin:auto;padding:28px 18px}.head{text-align:center;margin-bottom:25px}.head h1{margin:0;font-family:'Playfair Display',serif;font-size:34px;letter-spacing:1px}.head p{margin:6px 0;color:#9b9793;font-size:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#19191b;border:1px solid #353438;padding:20px;box-shadow:0 12px 35px #0005}.panel h2{font-size:15px;letter-spacing:2px;margin:0 0 17px;color:#cdbba8}.section{margin-top:22px;padding-top:18px;border-top:1px solid #353438}.section h3{margin:0 0 15px;font-size:11px;letter-spacing:2px;color:#a59b91}.field{margin-bottom:15px}.field label{display:block;font-size:12px;color:#aaa4a0;margin-bottom:6px;letter-spacing:1px}input,textarea,select,.rich-editor{width:100%;border:1px solid #3c393d;background:#101011;color:#eee;padding:11px 12px;font:14px Prompt,sans-serif;outline:none}textarea{min-height:115px;resize:vertical}input:focus,textarea:focus,select:focus,.rich-editor:focus{border-color:#9d8b79}.rich-toolbar{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #3c393d;border-bottom:0;background:#151517;flex-wrap:wrap}.tool-group{display:flex;align-items:center;gap:2px;padding:3px 4px;border-radius:9px;background:#222225;border:1px solid #333337}.rich-toolbar button{width:34px;height:32px;margin:0;padding:0;background:transparent;color:#d9d7d5;border:0;border-radius:6px;font:600 15px Prompt,sans-serif;cursor:pointer}.rich-toolbar button:hover,.rich-toolbar button.active{background:#38383c;color:#fff}.rich-toolbar .color-pick{width:34px;height:32px;padding:3px;border:0;border-radius:6px;background:transparent;cursor:pointer}.rich-editor{min-height:115px;resize:vertical;overflow:auto;line-height:1.8;white-space:pre-wrap}.rich-editor:empty:before{content:attr(data-placeholder);color:#777;pointer-events:none}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.color{height:42px;padding:4px;cursor:pointer}.range-row{display:grid;grid-template-columns:1fr 64px;gap:9px;align-items:center}.range-row input[type=range]{padding:0;accent-color:#c8b39d}.range-value{font-size:12px;text-align:center;color:#cfc8c1;border:1px solid #3c393d;padding:7px 3px;background:#101011}button{border:0;padding:12px 15px;background:#c8b39d;color:#171515;font:600 13px Prompt,sans-serif;cursor:pointer;width:100%;margin-top:8px}.copy{background:#29272a;color:#eee;border:1px solid #474349}.preview-wrap{min-width:0}.preview-label,.code-label{font-size:11px;letter-spacing:2px;color:#a59b91;margin:0 0 8px}.preview-box{background:#0d0d0e;padding:18px;border:1px solid #2e2d30;min-height:300px;overflow-x:auto;overflow-y:visible}#preview{width:760px;max-width:none;min-width:760px}.preview-box .tr-role{margin:0 auto}#output{width:100%;height:250px;background:#090909;color:#cfc8c1;border:1px solid #343136;padding:14px;font:12px monospace;margin-top:0}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:18px 10px}.preview-box{padding:8px}} .tester-link{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid #514b47;color:#cdbba8;text-decoration:none;font-size:11px;letter-spacing:1.5px}.tester-link:hover{background:#c8b39d;color:#171515}</style></head><body><main class="app"><div class="head"><h1>Roleplay Code Generator</h1><p>Black Role Box — เวอร์ชัน Tristian S. Kennedy</p><a class="tester-link" href="tester.html">🧪 OPEN CODE TESTER</a></div><div class="grid"><section class="panel"><h2>FILL YOUR DATA</h2><div class="field"><label>IMAGE URL</label><input id="image" value="https://i.pinimg.com/1200x/4f/3a/d5/4f3ad50febc7399ec5c9a947c27b8296.jpg" placeholder="วางลิงก์รูปภาพแนวนอน"></div><div class="field"><label>CHARACTER NAME</label><input id="name" value="Tristian S. Kennedy"></div><div class="field"><label>ROLEPLAY TEXT</label><div class="rich-toolbar"><div class="tool-group"><button type="button" id="boldRole" title="ตัวหนา"><b>B</b></button><button type="button" id="italicRole" title="ตัวเอียง"><i>I</i></button><button type="button" id="underlineRole" title="ขีดเส้นใต้"><u>U</u></button><button type="button" id="strikeRole" title="ขีดฆ่า"><s>S</s></button></div><div class="tool-group"><button type="button" id="alignLeft" title="ชิดซ้าย"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 10h11"/><path d="M4 14h16"/><path d="M4 18h9"/></svg></button><button type="button" id="alignCenter" title="กึ่งกลาง"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 10h10"/><path d="M4 14h16"/><path d="M7 18h10"/></svg></button><button type="button" id="alignRight" title="ชิดขวา"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M9 10h11"/><path d="M4 14h16"/><path d="M11 18h9"/></svg></button><button type="button" id="alignJustify" title="เต็มบรรทัด"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 10h16"/><path d="M4 14h16"/><path d="M4 18h16"/></svg></button></div><div class="tool-group"><input class="color-pick" id="roleColor" type="color" value="#d4d0cb" title="เลือกสีข้อความ"></div></div><div id="role" class="rich-editor" contenteditable="true" data-placeholder="พิมพ์เนื้อหาโรลเพลย์...">เนื้อหาโรลเพลย์</div></div><div class="field"><label>NOTE</label><textarea id="note">เนื้อหาหมายเหตุ</textarea></div><div class="field"><label>SIGNATURE</label><input id="sign" value="— Iloveyoubaby"></div><div class="section"><h3>IMAGE POSITION</h3><div class="field"><label>IMAGE SIZE</label><select id="photoSize"><option value="cover" selected>COVER</option><option value="contain">CONTAIN</option></select></div><div class="field"><label>ZOOM IMAGE</label><div class="range-row"><input id="photoZoom" type="range" min="50" max="200" value="100"><span class="range-value" id="photoZoomv">100%</span></div></div><div class="field"><label>HORIZONTAL POSITION</label><div class="range-row"><input id="photoX" type="range" min="0" max="100" value="50"><span class="range-value" id="photoXv">50%</span></div></div><div class="field"><label>VERTICAL POSITION</label><div class="range-row"><input id="photoY" type="range" min="0" max="100" value="50"><span class="range-value" id="photoYv">50%</span></div></div></div><div class="section"><h3>COLOR SETTINGS</h3><div class="row2"><div class="field"><label>BACKGROUND 1</label><input class="color" id="bg1" type="color" value="#111112"></div><div class="field"><label>BACKGROUND 2</label><input class="color" id="bg2" type="color" value="#1a1a1c"></div><div class="field"><label>NAME BACKGROUND</label><input class="color" id="nameBg" type="color" value="#1e1e20"></div><div class="field"><label>NAME TEXT</label><input class="color" id="nameText" type="color" value="#ebe7e2"></div><div class="field"><label>ROLE BACKGROUND</label><input class="color" id="contentBg" type="color" value="#1a1a1c"></div><div class="field"><label>ROLE TEXT</label><input class="color" id="contentText" type="color" value="#d4d0cb"></div><div class="field"><label>NOTE BACKGROUND</label><input class="color" id="noteBg" type="color" value="#151517"></div><div class="field"><label>NOTE TEXT</label><input class="color" id="noteText" type="color" value="#aaa6a2"></div></div></div><button id="generate">GENERATE CODE</button><button class="copy" id="copy">COPY CODE</button></section><section class="preview-wrap"><div class="preview-label">LIVE PREVIEW</div><div class="preview-box"><div id="preview"></div></div><div class="code-label" style="margin-top:22px">YOUR SHORT ROLEPLAY CODE</div><textarea id="output" readonly></textarea></section></div></main><script>const cssUrl='https://smemories145-cpu.github.io/Tristianloveyou/roleplay.css';const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function vals(){return{image:$('image').value.trim(),name:$('name').value||'CHARACTER NAME',role:$('role').innerHTML||'',note:$('note').value||'',sign:$('sign').value||'',photoSize:$('photoSize').value,photoZoom:$('photoZoom').value,photoX:$('photoX').value,photoY:$('photoY').value,bg1:$('bg1').value,bg2:$('bg2').value,nameBg:$('nameBg').value,nameText:$('nameText').value,contentBg:$('contentBg').value,contentText:$('contentText').value,noteBg:$('noteBg').value,noteText:$('noteText').value}}function styleVars(v){return '--role-photo:url('+esc(v.image)+');--role-photo-size:'+v.photoSize+';--role-photo-zoom:'+v.photoZoom+';--role-photo-x:'+v.photoX+'%;--role-photo-y:'+v.photoY+'%;--role-bg-1:'+v.bg1+';--role-bg-2:'+v.bg2+';--role-name-bg:'+v.nameBg+';--role-name-text:'+v.nameText+';--role-content-bg:'+v.contentBg+';--role-content-text:'+v.contentText+';--role-note-bg:'+v.noteBg+';--role-note-text:'+v.noteText+';'}function markup(v){return '<div class="tr-role" style="'+styleVars(v)+'"><div class="tr-role-frame"><div class="tr-role-photo"></div><div class="tr-role-name">'+esc(v.name)+'</div><div class="tr-role-content">'+v.role+'</div><div class="tr-role-note">'+esc(v.note)+'</div><div class="tr-role-sign">'+esc(v.sign)+'</div></div></div>'}function build(){const v=vals();$('photoZoomv').textContent=v.photoZoom+'%';$('photoXv').textContent=v.photoX+'%';$('photoYv').textContent=v.photoY+'%';$('preview').innerHTML=markup(v);$('output').value='<link rel="stylesheet" href="'+cssUrl+'">'+markup(v)}['image','name','role','note','sign','photoSize','photoZoom','photoX','photoY','bg1','bg2','nameBg','nameText','contentBg','contentText','noteBg','noteText'].forEach(id=>$(id).addEventListener('input',build));function cmd(command,value=null){$('role').focus();document.execCommand(command,false,value);build()}$('boldRole').onclick=()=>cmd('bold');$('italicRole').onclick=()=>cmd('italic');$('underlineRole').onclick=()=>cmd('underline');$('strikeRole').onclick=()=>cmd('strikeThrough');$('alignLeft').onclick=()=>cmd('justifyLeft');$('alignCenter').onclick=()=>cmd('justifyCenter');$('alignRight').onclick=()=>cmd('justifyRight');$('alignJustify').onclick=()=>cmd('justifyFull');$('roleColor').oninput=e=>cmd('foreColor',e.target.value);$('generate').onclick=build;$('copy').onclick=async()=>{build();try{await navigator.clipboard.writeText($('output').value);$('copy').textContent='COPIED!'}catch(e){$('output').select();document.execCommand('copy');$('copy').textContent='COPIED!'}setTimeout(()=>$('copy').textContent='COPY CODE',1200)};build();</script></body></html>
