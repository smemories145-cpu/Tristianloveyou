<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleplay Code Generator</title><style>@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Prompt,sans-serif}.app{max-width:1180px;margin:auto;padding:28px 18px}.head{text-align:center;margin-bottom:25px}.head h1{margin:0;font-family:'Playfair Display',serif;font-size:34px;letter-spacing:1px}.head p{margin:6px 0;color:#9b9793;font-size:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#19191b;border:1px solid #353438;padding:20px;box-shadow:0 12px 35px #0005}.panel h2{font-size:15px;letter-spacing:2px;margin:0 0 17px;color:#cdbba8}.field{margin-bottom:15px}.field label{display:block;font-size:12px;color:#aaa4a0;margin-bottom:6px;letter-spacing:1px}input,textarea{width:100%;border:1px solid #3c393d;background:#101011;color:#eee;padding:11px 12px;font:14px Prompt,sans-serif;outline:none}textarea{min-height:115px;resize:vertical}input:focus,textarea:focus{border-color:#9d8b79}button{border:0;padding:12px 15px;background:#c8b39d;color:#171515;font:600 13px Prompt,sans-serif;cursor:pointer;width:100%;margin-top:8px}.copy{background:#29272a;color:#eee;border:1px solid #474349}.preview-wrap{min-width:0}.preview-label,.code-label{font-size:11px;letter-spacing:2px;color:#a59b91;margin:0 0 8px}.preview-box{background:#0d0d0e;padding:18px;border:1px solid #2e2d30;min-height:300px}#preview{min-width:0}.tr-role{width:100%;max-width:760px;margin:auto;padding:14px;background:linear-gradient(135deg,#111112,#1a1a1c);box-shadow:0 12px 35px rgba(0,0,0,.3);font-family:Arial,sans-serif;color:#d8d5d1}.tr-role-frame{padding:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.018)}.tr-role-photo{height:150px;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.28)),var(--role-photo) center/cover;border:1px solid rgba(255,255,255,.28);box-shadow:0 5px 16px rgba(0,0,0,.28)}.tr-role-name{width:max-content;min-width:220px;max-width:75%;margin:-1px auto 20px;padding:7px 25px;text-align:center;color:#ebe7e2;font-family:Georgia,serif;font-size:25px;background:rgba(30,30,32,.94);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.22)}.tr-role-content{padding:24px;color:#d4d0cb;font-size:15px;line-height:2;white-space:pre-line;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.14)}.tr-role-note{margin-top:14px;padding:14px;color:#aaa6a2;font-size:12px;line-height:1.8;background:rgba(255,255,255,.015);border-top:1px solid rgba(255,255,255,.15)}.tr-role-note:before{content:"NOTE";display:block;margin-bottom:5px;font-size:8px;font-weight:bold;letter-spacing:2px;color:#85817d}.tr-role-sign{margin-top:14px;text-align:right;color:#77736f;font-family:Georgia,serif;font-size:13px;font-style:italic}#output{width:100%;height:250px;background:#090909;color:#cfc8c1;border:1px solid #343136;padding:14px;font:12px monospace;margin-top:22px}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:18px 10px}.tr-role-photo{height:125px}.tr-role-name{font-size:20px;min-width:180px}.tr-role-content{padding:20px;font-size:14px}}</style></head><body><main class="app"><div class="head"><h1>Roleplay Code Generator</h1><p>Black Role Box — เวอร์ชัน Tristian S. Kennedy</p></div><div class="grid"><section class="panel"><h2>FILL YOUR DATA</h2><div class="field"><label>IMAGE URL</label><input id="image" placeholder="วางลิงก์รูปภาพแนวนอน"></div><div class="field"><label>CHARACTER NAME</label><input id="name" value="Tristian S. Kennedy"></div><div class="field"><label>ROLEPLAY TEXT</label><textarea id="role">วางข้อความ Roleplay ของคุณตรงนี้

กล่องจะขยายความสูงตามจำนวนข้อความอัตโนมัติ</textarea></div><div class="field"><label>NOTE</label><textarea id="note">วางหมายเหตุ หรือข้อมูลเพิ่มเติมตรงนี้</textarea></div><div class="field"><label>SIGNATURE</label><input id="sign" value="— Iloveyoubaby"></div><button id="generate">GENERATE CODE</button><button class="copy" id="copy">COPY CODE</button></section><section class="preview-wrap"><div class="preview-label">LIVE PREVIEW</div><div class="preview-box"><div id="preview"></div></div><div class="code-label" style="margin-top:22px">YOUR SHORT ROLEPLAY CODE</div><textarea id="output" readonly></textarea></section></div></main><script>const cssUrl='https://smemories145-cpu.github.io/Tristianloveyou/roleplay.css';const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function previewHtml(i,n,r,no,s){return '<div class="tr-role" style="--role-photo:url('+esc(i)+');"><div class="tr-role-frame"><div class="tr-role-photo"></div><div class="tr-role-name">'+esc(n)+'</div><div class="tr-role-content">'+esc(r)+'</div><div class="tr-role-note">'+esc(no)+'</div><div class="tr-role-sign">'+esc(s)+'</div></div></div>'}function build(){const i=$('image').value.trim(),n=$('name').value||'CHARACTER NAME',r=$('role').value||'',no=$('note').value||'',s=$('sign').value||'';$('preview').innerHTML=previewHtml(i,n,r,no,s);const code='<link rel="stylesheet" href="'+cssUrl+'"><div class="tr-role" style="--role-photo:url('+esc(i)+');"><div class="tr-role-frame"><div class="tr-role-photo"></div><div class="tr-role-name">'+esc(n)+'</div><div class="tr-role-content">'+esc(r)+'</div><div class="tr-role-note">'+esc(no)+'</div><div class="tr-role-sign">'+esc(s)+'</div></div></div>';$('output').value=code}['image','name','role','note','sign'].forEach(id=>$(id).addEventListener('input',build));$('generate').onclick=build;$('copy').onclick=async()=>{build();try{await navigator.clipboard.writeText($('output').value);$('copy').textContent='COPIED!'}catch(e){$('output').select();document.execCommand('copy');$('copy').textContent='COPIED!'}setTimeout(()=>$('copy').textContent='COPY CODE',1200)};build();</script></body></html>
