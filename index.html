<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleplay Code Generator</title><style>@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Prompt,sans-serif}.app{max-width:1180px;margin:auto;padding:28px 18px}.head{text-align:center;margin-bottom:25px}.head h1{margin:0;font-family:'Playfair Display',serif;font-size:34px;letter-spacing:1px}.head p{margin:6px 0;color:#9b9793;font-size:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:#19191b;border:1px solid #353438;padding:20px;box-shadow:0 12px 35px #0005}.panel h2{font-size:15px;letter-spacing:2px;margin:0 0 17px;color:#cdbba8}.field{margin-bottom:15px}.field label{display:block;font-size:12px;color:#aaa4a0;margin-bottom:6px;letter-spacing:1px}input,textarea{width:100%;border:1px solid #3c393d;background:#101011;color:#eee;padding:11px 12px;font:14px Prompt,sans-serif;outline:none}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus{border-color:#9d8b79}button{border:0;padding:12px 15px;background:#c8b39d;color:#171515;font:600 13px Prompt,sans-serif;cursor:pointer;width:100%;margin-top:8px}.copy{background:#29272a;color:#eee;border:1px solid #474349}.preview-wrap{min-width:0}.preview-label,.code-label{font-size:11px;letter-spacing:2px;color:#a59b91;margin:0 0 8px}.tr-role{width:100%;max-width:760px;margin:auto;padding:14px;background:linear-gradient(145deg,#0b0b0c,#181719);border:1px solid #3a383c;box-shadow:0 15px 40px #0007;position:relative}.tr-role:before{content:"";position:absolute;inset:8px;border:1px solid #ffffff0f;pointer-events:none}.tr-role-image{height:260px;background:linear-gradient(to bottom,#0000000d,#00000061),var(--image) center/cover;border:1px solid #48454a;box-shadow:0 6px 18px #0006;position:relative}.tr-role-image:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff1f}.tr-role-name{text-align:center;margin:18px 0 12px;font-family:'Playfair Display',serif;font-size:32px;letter-spacing:3px;color:#f0ece6;text-shadow:0 2px 8px #000}.tr-role-name:after{content:"";display:block;width:55px;height:1px;margin:9px auto 0;background:#8d8276}.tr-role-text{padding:28px 32px;background:#141315;border:1px solid #3d3a3e;box-shadow:inset 0 0 25px #ffffff08;font-size:16px;line-height:1.9;color:#ded9d3;white-space:pre-wrap}.tr-role-note{margin-top:12px;padding:13px 18px;border:1px solid #39363a;background:#0f0f10;color:#aaa29b;font-size:12px;line-height:1.7}.tr-role-note:before{content:"NOTE  /  ";color:#c9b9a8;font-weight:bold;letter-spacing:2px}#output{width:100%;height:250px;background:#090909;color:#cfc8c1;border:1px solid #343136;padding:14px;font:12px monospace;margin-top:22px}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:18px 10px}.tr-role-image{height:200px}.tr-role-name{font-size:26px}.tr-role-text{padding:20px}}</style></head><body><main class="app"><div class="head"><h1>Roleplay Code Generator</h1><p>Black Role Box — สร้างโค้ดโรลเพลย์จากข้อมูลของคุณ</p></div><div class="grid"><section class="panel"><h2>FILL YOUR DATA</h2><div class="field"><label>IMAGE URL</label><input id="image" placeholder="วางลิงก์รูปภาพแนวนอน"></div><div class="field"><label>CHARACTER NAME</label><input id="name" value="CHARACTER NAME"></div><div class="field"><label>ROLEPLAY TEXT</label><textarea id="role">วางข้อความ Roleplay ของคุณตรงนี้

กล่องจะขยายความสูงตามจำนวนข้อความอัตโนมัติ</textarea></div><div class="field"><label>NOTE</label><textarea id="note">วางหมายเหตุ หรือข้อมูลเพิ่มเติมตรงนี้</textarea></div><button id="generate">GENERATE CODE</button><button class="copy" id="copy">COPY CODE</button></section><section class="preview-wrap"><div class="preview-label">LIVE PREVIEW</div><div id="preview"></div><div class="code-label" style="margin-top:22px">YOUR ROLEPLAY CODE</div><textarea id="output" readonly></textarea></section></div></main><script>const css='.tr-role{width:760px;max-width:100%;margin:25px auto;padding:14px;box-sizing:border-box;background:linear-gradient(145deg,#0b0b0c,#181719);border:1px solid #3a383c;box-shadow:0 15px 40px rgba(0,0,0,.45);font-family:Arial,sans-serif;color:#e9e5df;position:relative}.tr-role:before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.06);pointer-events:none}.tr-role-image{height:260px;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.38)),var(--image) center/cover;position:relative;border:1px solid #48454a;box-shadow:0 6px 18px rgba(0,0,0,.35)}.tr-role-image:after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.12);pointer-events:none}.tr-role-name{margin:18px 0 12px;text-align:center;font-family:Georgia,serif;font-size:32px;letter-spacing:3px;color:#f0ece6;text-shadow:0 2px 8px #000}.tr-role-name:after{content:"";display:block;width:55px;height:1px;margin:9px auto 0;background:#8d8276}.tr-role-text{padding:28px 32px;background:#141315;border:1px solid #3d3a3e;font-family:Tahoma,sans-serif;font-size:17px;line-height:1.9;color:#ded9d3;white-space:pre-wrap}.tr-role-note{margin-top:12px;padding:13px 18px;border:1px solid #39363a;background:#0f0f10;color:#a9a29b;font-size:12px;line-height:1.7}.tr-role-note:before{content:"NOTE  /  ";color:#c9b9a8;font-weight:bold;letter-spacing:2px}';const $=id=>document.getElementById(id);function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function build(){const i=$('image').value.trim(),n=$('name').value||'CHARACTER NAME',r=$('role').value||'',no=$('note').value||'';const code='<style>'+css+'</style><div class="tr-role" style="--image:url('+i+');"><div class="tr-role-image"></div><div class="tr-role-name">'+esc(n)+'</div><div class="tr-role-text">'+esc(r)+'</div><div class="tr-role-note">'+esc(no)+'</div></div>';$('preview').innerHTML='<div class="tr-role" style="--image:url('+i+')"><div class="tr-role-image"></div><div class="tr-role-name">'+esc(n)+'</div><div class="tr-role-text">'+esc(r)+'</div><div class="tr-role-note">'+esc(no)+'</div></div>';$('output').value=code}['image','name','role','note'].forEach(id=>$(id).addEventListener('input',build));$('generate').onclick=build;$('copy').onclick=async()=>{build();await navigator.clipboard.writeText($('output').value);$('copy').textContent='COPIED!';setTimeout(()=>$('copy').textContent='COPY CODE',1200)};build();</script></body></html>
