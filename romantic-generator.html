<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romantic Archive Generator</title><link rel="stylesheet" href="romantic-role.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#110f11;color:#eee4d7;font:13px 'Noto Serif Thai',serif}header{text-align:center;padding:25px;border-bottom:1px solid #65503c}h1{font:600 40px 'Cormorant Garamond',serif;margin:0}.layout{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(280px,400px) minmax(280px,1fr);gap:18px}.panel{background:#1b181a;border:1px solid #67503a;border-radius:8px;padding:18px}h2{font:600 26px 'Cormorant Garamond',serif;color:#d7b68e}label{display:block;margin:12px 0 4px;color:#d7b68e}input,textarea,select{width:100%;background:#100f11;color:#f5e9dc;border:1px solid #67503a;border-radius:5px;padding:9px;font:13px 'Noto Serif Thai',serif}textarea{min-height:130px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{margin:12px 8px 0 0;background:#c4a078;color:#171113;border:0;border-radius:5px;padding:10px 14px;cursor:pointer}.preview{display:flex;justify-content:center}.preview .rr-card{margin:0}#code{font:11px monospace;height:105px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><header><h1>Romantic Archive</h1>ROLEPLAY GENERATOR · ปรับแต่งและคัดลอกโค้ด</header><main class="layout"><section class="panel"><h2>01 / Customize</h2><label>ภาพพื้นหลัง</label><input id="bg" value="https://i.pinimg.com/1200x/d7/fd/34/d7fd342a0f362b8878cfae808790895d.jpg"><label>ภาพตัวละคร</label><input id="photo" value="https://i.pinimg.com/1200x/dd/7a/57/dd7a5777e4b27cc7f79064316e58e067.jpg"><div class="two"><div><label>ตำแหน่งแนวนอน</label><input id="x" type="range" min="0" max="100" value="50"></div><div><label>ตำแหน่งแนวตั้ง</label><input id="y" type="range" min="0" max="100" value="50"></div><div><label>สีภาพ</label><select id="gray"><option value="0">สีปกติ</option><option value="1">ขาวดำ</option></select></div><div><label>ขนาดข้อความ</label><select id="size"><option>13</option><option selected>14</option><option>15</option><option>16</option></select></div><div><label>Scene</label><input id="scene" value="07"></div><div><label>Take</label><input id="take" value="01"></div><div><label>ชื่อ</label><input id="name" value="TRISTIAN"></div><div><label>นามสกุล</label><input id="sub" value="SIDNEY KENNEDY"></div></div><label>ข้อความเหนือชื่อ</label><input id="eyebrow" value="The story of"><label>คำโปรย</label><input id="quote" value="A gentleman in a world that never stops."><label>ข้อความโรล</label><textarea id="story">นานมาแล้วที่ไม่ได้เก็บสมุน</textarea><label>หมายเหตุ</label><textarea id="note" style="min-height:60px">หมายเหตุ fishing ✧</textarea><label>ข้อความท้ายกรอบ</label><input id="footer" value="A PRIVATE ARCHIVE · TSK"><div><button id="copy">คัดลอก HTML</button><button id="download">บันทึก HTML</button></div><p id="status"></p><label>โค้ดสำหรับเว็บบอร์ด (บรรทัดเดียว)</label><textarea id="code" readonly></textarea></section><section class="panel"><h2>02 / Live Preview</h2><div class="preview" id="preview"></div></section></main><script>const CSS='https://smemories145-cpu.github.io/Tristianloveyou/romantic-role.css';const ids=['bg','photo','x','y','gray','size','scene','take','name','sub','eyebrow','quote','story','note','footer'];const el=id=>document.getElementById(id),v=id=>el(id).value,e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),url=s=>/^https:\/\//.test(s)?s.replace(/['"()\\]/g,''):'';function build(){return '<div class="rr-card" style="--rr-bg:url('+url(v('bg'))+');--rr-x:'+Number(v('x'))+'%;--rr-y:'+Number(v('y'))+'%;--rr-gray:'+Number(v('gray'))+'"><div class="rr-inner"><div class="rr-top"><span>MY BABY</span><span class="rr-rule"></span>✦<span class="rr-rule"></span><span>SCENE '+e(v('scene'))+' / TAKE '+e(v('take'))+'</span></div><div class="rr-head"><div class="rr-heading"><div class="rr-eyebrow">'+e(v('eyebrow'))+'</div><div class="rr-name">'+e(v('name'))+'</div><div class="rr-sub">'+e(v('sub'))+'</div><div class="rr-quote">'+e(v('quote'))+'</div></div><div class="rr-photo"><img src="'+e(url(v('photo')))+'"><div class="rr-photo-label">NO. 007 / TSK</div></div></div><div class="rr-story"><div class="rr-meta"><span>DAY X</span><span>TAKE '+e(v('take'))+'</span></div><div class="rr-sep"></div><div class="rr-text" style="font-size:'+Number(v('size'))+'px">'+e(v('story'))+'</div><div class="rr-sep"></div><div class="rr-note">NOTE / '+e(v('note'))+'</div></div><div class="rr-footer">'+e(v('footer'))+'</div></div></div>'}function render(){let h=build();el('preview').innerHTML=h;el('code').value='<link rel="stylesheet" href="'+CSS+'">'+h.replace(/\n/g,'&#10;')}ids.forEach(id=>el(id).addEventListener('input',render));el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('code').value);el('status').textContent='คัดลอกแล้ว ✓'}catch{el('code').select();el('status').textContent='เลือกโค้ดแล้ว กด Ctrl+C'}};el('download').onclick=()=>{let b=new Blob(['<!doctype html><meta charset="utf-8">'+el('code').value],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='romantic-role.html';a.click()};render();</script></body></html>
