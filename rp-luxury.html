<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Archive</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:var(--outer);color:var(--text);font-family:"Noto Sans Thai",sans-serif}.archive{width:min(760px,94vw);margin:28px auto;background:var(--paper);padding:28px 38px 30px;box-shadow:0 14px 42px #0002}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.identity{display:grid;grid-template-columns:1fr 205px;gap:28px;align-items:end;padding:25px 0 28px}.name{font:600 var(--name-size,76px)/.72 "Cormorant Garamond",serif;letter-spacing:-.025em}.surname{font:500 var(--sur-size,27px)/1 "Cormorant Garamond";color:var(--muted);margin-top:14px}.motto{font-size:10px;line-height:1.7;color:var(--muted);margin-left:auto}.photos{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-left:4%;width:92%;padding-bottom:4px}.photo{height:var(--photo1-h,330px);overflow:hidden;position:relative;box-shadow:7px 9px 0 var(--shadow),0 12px 25px #0002;border:1px solid var(--line2)}.photo:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.28);pointer-events:none;z-index:2}.photo.second{height:var(--photo2-h,318px);margin-top:var(--photo2-top,28px);margin-right:6px}.photo.second img{transform:scale(var(--img2-zoom,1))}.photo img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(var(--img-zoom,1));filter:saturate(.82);transition:.45s}.photo:hover img{transform:scale(1.015)}.divider{height:1px;background:var(--line);margin:30px 0 0}.rp{margin-top:22px;background:var(--panel);padding:24px 28px 22px;font-size:var(--rp-size,13px);line-height:2;color:var(--text);box-shadow:inset 0 1px #fff3,0 8px 22px #0001;border-left:1px solid var(--accent);border-right:1px solid var(--accent)}.rp p{margin:0 0 17px}.rp p:last-child{margin:0}.note{display:grid;grid-template-columns:55px 1fr;gap:20px;align-items:baseline;margin-top:22px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.note b{font-size:8px;line-height:1.8;letter-spacing:.18em;min-width:55px;color:var(--muted)}.note span{font-size:var(--note-size,10px);line-height:1.8;color:var(--muted)}.foot{margin-top:20px;font-size:8px;letter-spacing:.15em;color:var(--muted)}@media(max-width:650px){.archive{padding:24px 22px}.identity{grid-template-columns:1fr;gap:18px}.motto{margin:0}.photos{width:100%;margin:0;gap:10px}.photo{height:var(--photo1-h,245px)}.photo.second{height:var(--photo2-h,235px);margin-top:var(--photo2-top,10px)}.rp{padding:20px 18px}}</style></head><body><main class="archive" id="a"></main><script>const q=new URLSearchParams(location.search),g=k=>q.get(k)||'',e=s=>s.replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m])),d=g('theme')==='dark';const t=g('theme');const root=document.documentElement;[['name-size',g('nameSize')+'px'],['sur-size',g('surSize')+'px'],['rp-size',g('rpSize')+'px'],['note-size',g('noteSize')+'px'],['photo1-h',g('photo1H')+'px'],['photo2-h',g('photo2H')+'px'],['photo2-top',g('photo2Top')+'px'],['img-zoom',g('imgZoom')||'1'],['img2-zoom',g('img2Zoom')||'1']].forEach(([k,v])=>{if(v&&v!=='px')root.style.setProperty('--'+k,v)});const v=t==='dark'?{outer:'#111',paper:'#202020',text:'#eee',muted:'#aaa',line:'#555',line2:'#666',panel:'#292929',accent:'#777',shadow:'#0006'}:t==='gold'?{outer:'#0d0c0b',paper:'#171614',text:'#eee8dc',muted:'#b9a06b',line:'#655536',line2:'#7d6940',panel:'#211f1a',accent:'#b79a62',shadow:'#0008'}:{outer:'#b8aea2',paper:'#eeeae4',text:'#292929',muted:'#777067',line:'#b9afa3',line2:'#c7beb3',panel:'#e0d8ce',accent:'#a98e6e',shadow:'#66554418'};Object.entries(v).forEach(x=>document.documentElement.style.setProperty('--'+x[0],x[1]));let p=g('p')||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg',p2=g('p2')||p,name=g('name')||'TRISTIAN',sur=g('sur')||'Sidney Kennedy',motto=g('motto')||'A private record of a character, written between memory, silence and quiet moments.',rp=g('rp')||'ทริสเตียนยืนนิ่งอยู่ครู่หนึ่ง ปล่อยให้ความเงียบรอบตัวค่อย ๆ จางลง ก่อนจะหันกลับมามองอีกฝ่ายด้วยรอยยิ้มบาง ๆ',rpHtml=g('rpHtml'),note=g('note')||'รายละเอียดเล็ก ๆ ค่อย ๆ ปรากฏขึ้นระหว่างการโรล';a.innerHTML='<div class="top"><span>Private Archive / Character File</span><span>2026</span></div><section class="identity"><div><div class="name">'+e(name)+'</div><div class="surname">'+e(sur)+'</div></div><div class="motto">'+e(motto)+'</div></section><section class="photos"><div class="photo"><img src="'+e(p)+'"></div><div class="photo second"><img src="'+e(p2)+'"></div></section><div class="divider"></div><article class="rp">'+rp.split('|').filter(Boolean).map(x=>'<p>'+e(x)+'</p>').join('')+'</article><section class="note"><b>NOTE</b><span>'+e(note)+'</span></section><div class="foot">'+e(name)+' / Personal Archive</div>';</script></body></html>
