<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Film Generator</title><style>
*{box-sizing:border-box}body{margin:0;background:#211b1b;color:#ddd;font-family:"Noto Sans Thai",sans-serif}.app{width:min(1380px,96vw);margin:24px auto;display:grid;grid-template-columns:390px 1fr;gap:20px}.panel,.preview{background:#151313;border:1px solid #3b3232;border-radius:12px}.panel{padding:21px;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}.brand{font:600 30px "Cormorant Garamond";color:#e8dcd0}.sub{font-size:9px;letter-spacing:.2em;color:#8b7775;text-transform:uppercase;margin:2px 0 20px}.group{margin:15px 0}.group>label,.field label{display:block;font-size:11px;color:#aaa;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select{width:100%;border:1px solid #443b3b;background:#201d1d;color:#eee;border-radius:7px;padding:9px;font:12px "Noto Sans Thai"}input[type=range]{padding:0;border:0}.editor{border:1px solid #443b3b;border-radius:7px;overflow:hidden;background:#101010}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border-bottom:1px solid #332c2c}.toolbar button{min-width:29px;height:29px;border:1px solid #443b3b;background:#181616;color:#ddd;border-radius:5px}.editor-body{min-height:155px;padding:10px;outline:none;font-size:13px;line-height:2;white-space:pre-wrap}.editor-body:empty:before{content:"เขียนข้อความ RP ที่นี่...";color:#666}.count{display:flex;justify-content:space-between;font-size:10px;color:#8d7775;margin:7px 2px 0}.range-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-row label{font-size:10px;color:#aaa}.val{float:right;color:#8d7775}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid #7d4547;background:#8f3035;color:#fff;padding:10px 14px;border-radius:7px;font-weight:600;cursor:pointer}.actions .secondary{background:#282222;border-color:#514545}.code{margin-top:13px;background:#0d0d0d;border:1px solid #342d2d;border-radius:7px;padding:10px;min-height:55px;font:10px/1.5 monospace;word-break:break-all;color:#bcaeaa}.preview{padding:20px;overflow:auto;display:flex;justify-content:center}.preview-inner{width:min(760px,100%)}@media(max-width:950px){.app{grid-template-columns:1fr}.panel{order:1}.preview{order:2}}
</style></head><body><div class="app"><section class="panel"><div class="brand">Rose Film</div><div class="sub">Private Film Diary Generator</div>
<div class="group"><label>โทน</label><select id="theme"><option value="">ROSE NOIR · ดำ / แดงกุหลาบ</option><option value="theme-bw">BLACK & WHITE</option><option value="theme-light">FADED PAPER · ครีมฟิล์ม</option></select></div>
<div class="group row"><div class="field"><label>รูป 1</label><input id="p1" placeholder="URL รูปภาพ"></div><div class="field"><label>รูป 2</label><input id="p2" placeholder="URL รูปภาพ"></div></div>
<div class="group row"><div class="field"><label>ชื่อ</label><input id="name" value="TRISTIAN"></div><div class="field"><label>นามสกุล</label><input id="sur" value="Sidney Kennedy"></div></div>
<div class="group"><label>คำโปรย</label><input id="motto" value="A private film diary of quiet moments."></div>
<div class="group"><label>ข้อความ RP</label><div class="editor"><div class="toolbar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('underline')"><u>U</u></button><button onclick="fmt('strikeThrough')"><s>S</s></button><button onclick="fmt('justifyLeft')">≡←</button><button onclick="fmt('justifyCenter')">≡</button><button onclick="fmt('justifyRight')">→≡</button></div><div id="rp" class="editor-body" contenteditable="true"></div></div><div class="count"><span id="words">0 คำ</span><span id="chars">0 ตัวอักษร</span></div></div>
<div class="group"><label>Note</label><input id="note" value="รายละเอียดเล็ก ๆ ระหว่างการโรล"></div>
<div class="group"><label>ขนาดตัวอักษร / รูป</label><div class="range-row"><div><label>ชื่อ <span class="val" id="nameV"></span></label><input id="nameS" type="range" min="48" max="90" value="68"></div><div><label>นามสกุล <span class="val" id="surV"></span></label><input id="surS" type="range" min="18" max="35" value="25"></div><div><label>RP <span class="val" id="rpV"></span></label><input id="rpS" type="range" min="11" max="17" value="13"></div><div><label>Note <span class="val" id="noteV"></span></label><input id="noteS" type="range" min="8" max="14" value="10"></div><div><label>รูป 1 สูง <span class="val" id="p1V"></span></label><input id="p1S" type="range" min="180" max="420" value="285"></div><div><label>รูป 2 สูง <span class="val" id="p2V"></span></label><input id="p2S" type="range" min="160" max="380" value="240"></div></div></div>
<div class="group"><label>ซูม / ตำแหน่งรูป</label><div class="range-row"><div><label>ซูม 1 <span class="val" id="z1V"></span></label><input id="z1" type="range" min="1" max="1.5" step=".01" value="1"></div><div><label>ซูม 2 <span class="val" id="z2V"></span></label><input id="z2" type="range" min="1" max="1.5" step=".01" value="1"></div><div><label>รูป 1 X <span class="val" id="x1V"></span></label><input id="x1" type="range" min="0" max="100" value="50"></div><div><label>รูป 1 Y <span class="val" id="y1V"></span></label><input id="y1" type="range" min="0" max="100" value="50"></div><div><label>รูป 2 X <span class="val" id="x2V"></span></label><input id="x2" type="range" min="0" max="100" value="50"></div><div><label>รูป 2 Y <span class="val" id="y2V"></span></label><input id="y2" type="range" min="0" max="100" value="50"></div></div></div>
<div class="actions"><button onclick="generate()">Generate Code</button><button class="secondary" onclick="copyCode()">Copy Code</button><button class="secondary" onclick="location.reload()">Reset</button></div><div class="code" id="code">กด Generate Code เพื่อสร้างโค้ด</div></section><section class="preview"><div class="preview-inner" id="preview"></div></section></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmt(c){$('rp').focus();document.execCommand(c,false,null);render()}
function counter(){const t=$('rp').innerText.trim();let w=0;if(t&&Intl.Segmenter)w=[...new Intl.Segmenter('th',{granularity:'word'}).segment(t)].filter(x=>x.isWordLike).length;else w=t?t.split(/\s+/).filter(Boolean).length:0;$('words').textContent=w+' คำ';$('chars').textContent=t.replace(/\s/g,'').length+' ตัวอักษร'}
function vals(){[['nameS','nameV','px'],['surS','surV','px'],['rpS','rpV','px'],['noteS','noteV','px'],['p1S','p1V','px'],['p2S','p2V','px'],['z1','z1V','×'],['z2','z2V','×'],['x1','x1V','%'],['y1','y1V','%'],['x2','x2V','%'],['y2','y2V','%']].forEach(a=>$(a[1]).textContent=$(a[0]).value+a[2])}
function render(){vals();counter();const t=$('theme').value,p1=$('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg',p2=$('p2').value||p1,pr=$('preview');pr.innerHTML='<link rel="stylesheet" href="https://smemories145-cpu.github.io/Tristianloveyou/rose-film.css?v=1"><div class="rose-film '+t+'" style="--rf-name:'+$('nameS').value+'px;--rf-sur:'+$('surS').value+'px;--rf-rp:'+$('rpS').value+'px;--rf-note:'+$('noteS').value+'px;--rf-p1:'+$('p1S').value+'px;--rf-p2:'+$('p2S').value+'px;--rf-z1:'+$('z1').value+';--rf-z2:'+$('z2').value+';--rf-x1:'+$('x1').value+'%;--rf-y1:'+$('y1').value+'%;--rf-x2:'+$('x2').value+'%;--rf-y2:'+$('y2').value+'%"><div class="rf-top"><span>Private Film Diary</span><span>2026</span></div><div class="rf-head"><div class="rf-name">'+esc($('name').value)+'</div><div class="rf-sur">'+esc($('sur').value)+'</div><div class="rf-motto">'+esc($('motto').value)+'</div></div><div class="rf-photos"><div class="rf-photo"><img src="'+esc(p1)+'"></div><div class="rf-frame">Frame / 01</div><div class="rf-photo second"><img src="'+esc(p2)+'"></div><div class="rf-frame">Frame / 02</div></div><div class="rf-divider"></div><article class="rf-rp">'+$('rp').innerHTML+'</article><section class="rf-note"><b>NOTE</b><span>'+esc($('note').value)+'</span></section><div class="rf-foot"><span>Rose Film</span><span>'+esc($('name').value)+'</span></div></div>'}
function generate(){const v='--rf-name:'+$('nameS').value+'px;--rf-sur:'+$('surS').value+'px;--rf-rp:'+$('rpS').value+'px;--rf-note:'+$('noteS').value+'px;--rf-p1:'+$('p1S').value+'px;--rf-p2:'+$('p2S').value+'px;--rf-z1:'+$('z1').value+';--rf-z2:'+$('z2').value+';--rf-x1:'+$('x1').value+'%;--rf-y1:'+$('y1').value+'%;--rf-x2:'+$('x2').value+'%;--rf-y2:'+$('y2').value+'%';const p1=esc($('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg'),p2=esc($('p2').value||$('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg');$('code').textContent='<link rel="stylesheet" href="https://smemories145-cpu.github.io/Tristianloveyou/rose-film.css?v=1">\\n<div class="rose-film '+$('theme').value+'" style="'+v+'"><div class="rf-top"><span>Private Film Diary</span><span>2026</span></div><div class="rf-head"><div class="rf-name">'+esc($('name').value)+'</div><div class="rf-sur">'+esc($('sur').value)+'</div><div class="rf-motto">'+esc($('motto').value)+'</div></div><div class="rf-photos"><div class="rf-photo"><img src="'+p1+'"></div><div class="rf-frame">Frame / 01</div><div class="rf-photo second"><img src="'+p2+'"></div><div class="rf-frame">Frame / 02</div></div><div class="rf-divider"></div><article class="rf-rp">'+$('rp').innerHTML+'</article><section class="rf-note"><b>NOTE</b><span>'+esc($('note').value)+'</span></section><div class="rf-foot"><span>Rose Film</span><span>'+esc($('name').value)+'</span></div></div>'}
function copyCode(){if($('code').textContent.startsWith('กด '))generate();if(navigator.clipboard)navigator.clipboard.writeText($('code').textContent)}
['theme','p1','p2','name','sur','motto','note','nameS','surS','rpS','noteS','p1S','p2S','z1','z2','x1','y1','x2','y2'].forEach(id=>$(id).addEventListener('input',render));$('rp').addEventListener('input',render);render();
</script></body></html>
