const snippet=n=>fontLink+'<style>'+themeCSS+'</style>'+make(n,data());

styles.forEach(item=>{

function show(){document.querySelectorAll('[data-preview]').forEach(el=>el.innerHTML=make(Number(el.dataset.preview),data()))}
function status(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(status.timer);status.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function copyFallback(s){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy failed')}
async function copy(n){try{const code=snippet(n);if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(code);else copyFallback(code);status('✓ คัดลอกโค้ดแบบ '+n+' แล้ว')}catch(e){status('คัดลอกไม่สำเร็จ ลองดาวน์โหลดไฟล์แทน')}}
function download(n){const blob=new Blob([snippet(n)],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='little-home-golden-hour-'+n+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);status('✓ ดาวน์โหลดแบบ '+n+' แล้ว')}
gallery.addEventListener('click',e=>{const c=e.target.closest('[data-copy]'),d=e.target.closest('[data-download]');if(c)copy(Number(c.dataset.copy));if(d)download(Number(d.dataset.download))});
let timer;function save(){try{localStorage.setItem(savedKey,JSON.stringify(Object.fromEntries(fields.map(k=>[k,value(k)]))))}catch(e){}}
fields.forEach(k=>$(k).addEventListener('input',()=>{show();clearTimeout(timer);timer=setTimeout(save,350)}));
try{const old=JSON.parse(localStorage.getItem(savedKey)||'null');if(old&&typeof old==='object')fields.forEach(k=>{if(typeof old[k]==='string')$(k).value=old[k]})}catch(e){}
show();window.addEventListener('pagehide',()=>{clearTimeout(timer);save()});
