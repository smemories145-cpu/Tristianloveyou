<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Home · Location Card Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f3f1ed;color:#493f40;font:13px/1.7 'Noto Serif Thai',serif}header{padding:26px 22px;background:#fffcf8;border-bottom:1px solid #ded9d3}header>div{max-width:1250px;margin:auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}h1{margin:0;font:600 28px 'Playfair Display',serif;color:#5d6857}header p{margin:3px 0 0;color:#938c87}.back{color:#926f7c;text-decoration:none}.container{max-width:1250px;margin:0 auto;padding:20px 14px 55px}.settings{background:#fffdf9;border:1px solid #ddd6cf;border-radius:13px;padding:17px;margin-bottom:17px;box-shadow:0 4px 20px #71675b0a}h2{font-size:14px;margin:0 0 10px;color:#756c65}.inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.inputs label{font-size:11px;color:#7d7370;display:block}.inputs input,.inputs textarea{width:100%;margin-top:5px;border-radius:7px;border:1px solid #d9d3cd;padding:9px 11px;background:#fff;color:#524b46;font:13px 'Noto Serif Thai',serif}.inputs textarea{height:86px;resize:vertical}.inputs .wide{grid-column:span 2}.note{font-size:11px;color:#91877f;margin:9px 0 0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.design{min-width:0;background:#fffefa;border:1px solid #ddd5d0;border-radius:13px;overflow:hidden;box-shadow:0 7px 22px #756e640d}.design-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #e8e1db}.design-head strong{font:600 13px 'DM Sans',sans-serif;color:#5b6157}.design-head small{color:#938b86;display:block;font-size:11px}.design-actions{display:flex;gap:6px;flex-shrink:0}button{border:1px solid #c8b9b0;background:#fbf3ed;color:#76585f;padding:8px 10px;border-radius:7px;font:600 11px 'Noto Serif Thai',serif;cursor:pointer}button:hover{background:#eee0db}.preview{padding:12px;background:#ece7e1;min-height:340px;overflow:hidden}.preview>*{margin:0 auto!important}.status{position:fixed;bottom:14px;right:14px;background:#5e7060;color:white;border-radius:9px;padding:10px 16px;box-shadow:0 8px 30px #0002;font-size:12px;display:none;z-index:99}.status.show{display:block}@media(max-width:850px){.gallery{grid-template-columns:1fr}.inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.inputs{grid-template-columns:1fr}.inputs .wide{grid-column:auto}.preview{padding:5px}.design-head{padding:11px}.design-actions button{font-size:10px;padding:7px}h1{font-size:23px}}
</style></head><body>
<header><div><div><h1>✿ Little Home · Location Gallery</h1><p>เลือกกรอบสถานที่ในบ้าน 4 สไตล์ · เปลี่ยนข้อมูลแล้วดูพรีวิว · คัดลอก HTML ได้ทันที</p></div><a class="back" href="nocturne-generator.html">↗ NOCTURNE</a></div></header>
<div class="container"><section class="settings"><h2>01 / ปรับข้อมูลสำหรับทุกตัวอย่าง</h2><div class="inputs">
<label>ชื่อห้องภาษาอังกฤษ<input id="room" value="The Bedroom"></label>
<label>ชื่อห้องภาษาไทย<input id="thai" value="ห้องนอน · พื้นที่ส่วนตัว"></label>
<label>ชั้น / ตำแหน่ง<input id="floor" value="SECOND FLOOR"></label>
<label>รูปห้อง (URL)<input id="mainImage" value="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1000&q=85"></label>
<label class="wide">รูปพื้นหลังสวน/หญ้า (URL)<input id="bgImage" value="https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1200&q=85"></label>
<label>เลขห้อง<input id="number" value="01"></label>
<label class="wide">คำบรรยาย<textarea id="description">ห้องนอนขนาดกำลังดีที่เปิดรับแสงแดดอ่อน ๆ ในตอนเช้า ม่านสีครีมไหวตามลม มีแจกันดอกไม้เล็ก ๆ อยู่ข้างเตียง และมุมอ่านหนังสือที่เงียบสงบ เหมาะกับการใช้เวลาส่วนตัว</textarea></label>
<label>หมายเหตุ<textarea id="note">บรรยากาศอบอุ่น เป็นส่วนตัว และมีกลิ่นหอมจาง ๆ ของดอกไม้</textarea></label>
</div><p class="note">รูปภาพเป็นตัวอย่างออนไลน์ เปลี่ยนเป็น URL รูปของตัวเองได้ · ทุกปุ่ม “คัดลอกโค้ด” จะได้ HTML พร้อม CSS ของดีไซน์นั้น ๆ</p></section>
<div class="gallery" id="gallery"></div></div><div class="status" id="status" role="status"></div>
<script>
'use strict';
const $=x=>document.getElementById(x);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const safeUrl=s=>/^https:\/\/[^\s"'<>]+$/i.test(String(s).trim())?String(s).trim():'';
const fields=['room','thai','floor','mainImage','bgImage','number','description','note'];
const data=()=>Object.fromEntries(fields.map(x=>[x,esc($(x).value)]));
const photo=s=>safeUrl(s)||'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=1000';
const garden=s=>safeUrl(s)||'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=1200';
const css="\n.lh1,.lh2,.lh3,.lh4{box-sizing:border-box;max-width:590px;width:100%;overflow:hidden;color:#5e5d55;font-family:Georgia,'Noto Serif Thai',serif}.lh1 *,.lh2 *,.lh3 *,.lh4 *{box-sizing:border-box}\n.lh1{padding:20px;background-size:cover;background-position:center;border-radius:18px;box-shadow:0 12px 30px #3336;border:5px solid #e7eddf}.lh1 .paper{padding:23px;background:rgba(255,253,247,.94);border:1px solid #ffffffd9;border-radius:10px}.lh1 .eyebrow{font:600 10px Arial,sans-serif;letter-spacing:2px;color:#9e7883}.lh1 h2{font:500 clamp(26px,6vw,39px) Georgia,serif;color:#5e6956;margin:11px 0 4px}.lh1 .thai{color:#a07886;font:italic 13px Georgia,'Noto Serif Thai',serif}.lh1 img{display:block;width:100%;height:215px;object-fit:cover;border-radius:5px;margin:17px 0;border:5px solid white;box-shadow:0 3px 13px #756b5430}.lh1 .desc{font:14px/2 'Noto Serif Thai',serif;color:#6d6e65}.lh1 .foot{border-top:1px solid #dcded1;margin-top:18px;padding-top:11px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#9e7883;font:10px Arial,sans-serif;letter-spacing:1px}\n.lh2{position:relative;background:#f6f2ed;padding:22px;border:1px solid #cfc5be;box-shadow:0 12px 26px #6559472b}.lh2 .stamp{position:absolute;top:15px;right:18px;border:1px dashed #c79ca4;border-radius:100%;width:65px;height:65px;display:grid;place-items:center;color:#c08d9c;transform:rotate(13deg);font:italic 20px Georgia,serif}.lh2 .top{font:600 10px Arial,sans-serif;letter-spacing:2px;color:#8f9e84}.lh2 .photo{width:68%;margin:25px 0 13px 5%;transform:rotate(-3deg);background:#fff;padding:9px 9px 28px;box-shadow:0 5px 19px #6659513d}.lh2 .photo img{width:100%;height:220px;object-fit:cover;display:block}.lh2 .name{font:500 clamp(28px,6vw,42px) Georgia,serif;color:#686458;margin:8px 0}.lh2 .thai{font:italic 14px Georgia,'Noto Serif Thai',serif;color:#b38b96}.lh2 .desc{margin:15px 0 0;padding:14px 0 0;border-top:1px solid #d9cbc6;font:14px/1.95 'Noto Serif Thai',serif;color:#6f6b64}.lh2 .foot{margin-top:14px;font:10px Arial,sans-serif;color:#9f7e86;letter-spacing:2px}\n.lh3{position:relative;background:#e5eadf;padding:17px;border-radius:3px;border:1px solid #c6d2bd}.lh3 .window{background:#fffcf7;border:6px solid #fff;padding:0 0 22px;box-shadow:0 6px 16px #596e4726}.lh3 .hero{height:250px;background-position:center;background-size:cover;position:relative}.lh3 .roomcard{position:relative;z-index:2;margin:-48px 23px 0;background:#fffdf8;padding:17px 19px 19px;border:1px solid #e2e3d9;box-shadow:0 8px 19px #4a5c4a21}.lh3 .eyebrow{font:600 10px Arial,sans-serif;letter-spacing:2px;color:#a9818d}.lh3 h2{margin:8px 0 4px;color:#5b7160;font:500 clamp(27px,6vw,40px) Georgia,serif}.lh3 .thai{color:#9c858b;font:italic 13px Georgia,'Noto Serif Thai',serif}.lh3 .desc{font:14px/1.95 'Noto Serif Thai',serif;color:#77736e;margin-top:15px}.lh3 .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:17px;color:#6f907a;font:10px Arial,sans-serif;letter-spacing:1.5px}\n.lh4{border-radius:13px;background:#fcfaf6;border:1px solid #decfcb;box-shadow:0 12px 26px #6e575228;padding:21px}.lh4 .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e0d4d0;padding:0 0 14px;font:600 10px Arial,sans-serif;letter-spacing:1.6px;color:#aa8790}.lh4 .main{display:grid;grid-template-columns:45% 1fr;gap:17px;padding-top:18px}.lh4 .main img{width:100%;height:250px;object-fit:cover;border-radius:90px 90px 5px 5px;border:6px solid #edf0e9}.lh4 h2{color:#806b67;margin:10px 0 8px;font:500 clamp(27px,5vw,37px) Georgia,serif}.lh4 .thai{color:#a27e88;font:italic 13px Georgia,'Noto Serif Thai',serif}.lh4 .flower{color:#9eae92;font-size:32px;line-height:1;margin:6px 0 10px}.lh4 .desc{font:13px/1.95 'Noto Serif Thai',serif;color:#756e6b}.lh4 .note{margin-top:18px;padding:10px 15px;background:#f3eee7;border-left:2px solid #b69da2;color:#887d77;font:12px/1.9 'Noto Serif Thai',serif}.lh4 .foot{margin-top:14px;text-align:right;font:10px Arial,sans-serif;letter-spacing:2px;color:#9eae92}\n@media(max-width:480px){.lh2 .photo{width:81%}.lh4 .main{grid-template-columns:1fr}.lh4 .main img{height:210px;border-radius:100px 100px 8px 8px}.lh1{padding:11px}.lh1 .paper{padding:15px}.lh3 .roomcard{margin-left:12px;margin-right:12px}}\n";
function make(i,d){
 const r=d.room,t=d.thai,f=d.floor,num=d.number,desc=d.description,n=d.note,p=photo($('mainImage').value),bg=garden($('bgImage').value);
 const common='<div style="font-family:Georgia,serif">';
 if(i===1)return '<div class="lh1" style="background-image:linear-gradient(#e4e9de8c,#e4e9de8c),url(&quot;'+esc(bg)+'&quot;)"><div class="paper"><div class="eyebrow">✿ HOUSE GARDEN / ROOM '+num+'</div><h2>'+r+'</h2><div class="thai">'+t+'</div><img alt="room" src="'+esc(p)+'"><div class="desc">'+desc+'</div><div class="foot"><span>❀ '+f+'</span><span>HOME SWEET HOME · '+num+'</span></div></div></div>';
 if(i===2)return '<div class="lh2"><div class="stamp">✿ '+num+'</div><div class="top">BOTANICAL MEMORIES / HOME JOURNAL</div><div class="photo"><img alt="room" src="'+esc(p)+'"></div><div class="name">'+r+'</div><div class="thai">'+t+'</div><div class="desc">'+desc+'</div><div class="foot">✽ '+f+' / PRESSED FLOWERS & QUIET DAYS</div></div>';
 if(i===3)return '<div class="lh3"><div class="window"><div class="hero" style="background-image:linear-gradient(0deg,#30442a30,#ffffff0c),url(&quot;'+esc(bg)+'&quot;)"></div><div class="roomcard"><div class="eyebrow">A LITTLE PLACE TO CALL HOME · '+num+'</div><h2>'+r+'</h2><div class="thai">'+t+'</div><div class="desc">'+desc+'</div><div class="foot"><span>❀ '+f+'</span><span>THE GARDEN HOUSE</span></div></div></div></div>';
 return '<div class="lh4"><div class="head"><span>✿ COTTAGE HOUSE / '+num+'</span><span>'+f+'</span></div><div class="main"><img alt="room" src="'+esc(p)+'"><div><div class="flower">❃</div><h2>'+r+'</h2><div class="thai">'+t+'</div><div class="desc">'+desc+'</div></div></div><div class="note">✿ '+n+'</div><div class="foot">WITH LOVE, FROM HOME ✧</div></div>';
}
const options=[['Green Garden','สวนหญ้าจริงเป็นพื้นหลัง + กระดาษขาว'],['Botanical Scrapbook','ภาพโพลารอยด์ในสมุดพฤกษศาสตร์'],['Garden Window','วิวสวนใหญ่ + ป้ายชื่อห้องซ้อนภาพ'],['Cottage Letter','ภาพโค้งแบบหน้าต่าง + จดหมายบ้าน']];
function snippet(i){const rules=css;return '<style>'+rules+'</style>'+make(i,data())}
function update(){document.querySelectorAll('.preview').forEach(el=>{const i=Number(el.dataset.design);el.innerHTML=snippet(i)})}
function notice(msg){const s=$('status');s.textContent=msg;s.classList.add('show');clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>s.classList.remove('show'),2200)}
async function copy(i){const t=snippet(i).replace(/\n/g,'');try{await navigator.clipboard.writeText(t);notice('✓ คัดลอกโค้ดแบบ '+i+' แล้ว')}catch(e){const textarea=document.createElement('textarea');textarea.value=t;document.body.appendChild(textarea);textarea.select();document.execCommand('copy');textarea.remove();notice('✓ คัดลอกโค้ดแล้ว')}}
function save(i){const text=snippet(i);const blob=new Blob([text],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='home-location-style-'+i+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notice('ดาวน์โหลด HTML แบบ '+i+' แล้ว')}
const g=$('gallery');options.forEach((row,j)=>{let i=j+1,el=document.createElement('article');el.className='design';el.innerHTML='<div class="design-head"><div><strong>0'+i+' · '+row[0]+'</strong><small>'+row[1]+'</small></div><div class="design-actions"><button type="button" data-copy="'+i+'">คัดลอกโค้ด</button><button type="button" data-save="'+i+'">โหลด .html</button></div></div><div class="preview" data-design="'+i+'"></div>';g.appendChild(el)});
g.addEventListener('click',e=>{const a=e.target.closest('[data-copy]'),b=e.target.closest('[data-save]');if(a)copy(Number(a.dataset.copy));if(b)save(Number(b.dataset.save))});
fields.forEach(id=>$(id).addEventListener('input',update));update();
</script></body></html>
