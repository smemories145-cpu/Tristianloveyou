<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Contact Sheet Generator</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#191414;color:#ddd;font-family:"Noto Sans Thai",sans-serif}.app{width:min(1400px,96vw);margin:22px auto;display:grid;grid-template-columns:360px 1fr;gap:18px}.controls,.stage{background:#111;border:1px solid #332a2a}.controls{padding:20px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.stage{padding:28px;min-height:calc(100vh - 44px);display:flex;align-items:flex-start;justify-content:center}.brand{font:600 31px "Cormorant Garamond";color:#e8ddd1}.kicker{font:8px "DM Mono",monospace;letter-spacing:.18em;color:#806f6b;margin:2px 0 22px;text-transform:uppercase}.group{margin:16px 0}.group>label{display:block;font-size:10px;color:#aaa;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;background:#1c1818;color:#eee;border:1px solid #403535;border-radius:6px;padding:9px;font:12px "Noto Sans Thai"}input[type=range]{padding:0;border:0}.editor{border:1px solid #403535;background:#0d0d0d;border-radius:6px;overflow:hidden}.toolbar{display:flex;gap:4px;padding:7px;border-bottom:1px solid #302727}.toolbar button{width:28px;height:28px;background:#171313;border:1px solid #403535;color:#ddd;border-radius:4px}.editor-body{min-height:150px;padding:10px;outline:0;font-size:13px;line-height:2}.editor-body:empty:before{content:"เขียนฉากตรงนี้...";color:#666}.count{display:flex;justify-content:space-between;margin-top:6px;font:9px "DM Mono";color:#8d7772}.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-grid label{font-size:9px;color:#aaa}.val{float:right;color:#8c716d}.actions{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap}.actions button{border:1px solid #7c4043;background:#91363c;color:#fff;padding:9px 12px;border-radius:6px;font-weight:600}.actions .secondary{background:#282020;border-color:#493b3b}.code{margin-top:12px;min-height:60px;padding:9px;background:#0a0909;border:1px solid #302727;color:#aaa;font:9px/1.5 monospace;word-break:break-all}@media(max-width:900px){.app{grid-template-columns:1fr}.controls{max-height:none}.stage{min-height:auto;padding:12px}}
</style></head><body><div class="app"><aside class="controls"><div class="brand">Rose Contact</div><div class="kicker">Darkroom / Scene Builder</div>
<div class="group"><label>โทน</label><select id="theme"><option value="">ROSE NOIR</option><option value="theme-green">MOSS / ROSE</option><option value="theme-paper">FADED PAPER</option></select></div>
<div class="group row"><div><label>รูป 01</label><input id="p1" placeholder="URL รูปภาพ"></div><div><label>รูป 02</label><input id="p2" placeholder="URL รูปภาพ"></div></div>
<div class="group row"><div><label>ชื่อ</label><input id="name" value="TRISTIAN"></div><div><label>นามสกุล</label><input id="sur" value="Sidney Kennedy"></div></div>
<div class="group row"><div><label>Scene</label><input id="scene" value="SCENE / 07"></div><div><label>Frame</label><input id="frame" value="04"></div></div>
<div class="group"><label>คำโปรย</label><input id="motto" value="some moments remain unfinished."></div>
<div class="group"><label>ข้อความ RP</label><div class="editor"><div class="toolbar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('underline')"><u>U</u></button><button onclick="fmt('strikeThrough')"><s>S</s></button><button onclick="fmt('justifyLeft')">←</button><button onclick="fmt('justifyCenter')">↔</button><button onclick="fmt('justifyRight')">→</button></div><div id="rp" class="editor-body" contenteditable="true"></div></div><div class="count"><span id="words">0 WORDS</span><span id="chars">0 CHARS</span></div></div>
<div class="group"><label>Note</label><input id="note" value="รายละเอียดเล็ก ๆ ระหว่างฉาก"></div>
<div class="group"><label>Typography / Frame</label><div class="range-grid"><div><label>ชื่อ <span class="val" id="nameV"></span></label><input id="nameS" type="range" min="48" max="92" value="76"></div><div><label>นามสกุล <span class="val" id="surV"></span></label><input id="surS" type="range" min="18" max="34" value="25"></div><div><label>RP <span class="val" id="rpV"></span></label><input id="rpS" type="range" min="11" max="18" value="14"></div><div><label>Note <span class="val" id="noteV"></span></label><input id="noteS" type="range" min="8" max="14" value="10"></div><div><label>รูป 01 สูง <span class="val" id="p1V"></span></label><input id="p1S" type="range" min="220" max="480" value="350"></div><div><label>รูป 02 สูง <span class="val" id="p2V"></span></label><input id="p2S" type="range" min="160" max="360" value="220"></div><div><label>ซูม 01 <span class="val" id="z1V"></span></label><input id="z1" type="range" min="1" max="1.5" step=".01" value="1"></div><div><label>ซูม 02 <span class="val" id="z2V"></span></label><input id="z2" type="range" min="1" max="1.5" step=".01" value="1"></div></div></div>
<div class="group"><label>Position</label><div class="range-grid"><div><label>01 X <span class="val" id="x1V"></span></label><input id="x1" type="range" min="0" max="100" value="50"></div><div><label>01 Y <span class="val" id="y1V"></span></label><input id="y1" type="range" min="0" max="100" value="50"></div><div><label>02 X <span class="val" id="x2V"></span></label><input id="x2" type="range" min="0" max="100" value="50"></div><div><label>02 Y <span class="val" id="y2V"></span></label><input id="y2" type="range" min="0" max="100" value="50"></div></div></div>
<div class="actions"><button onclick="generate()">Generate Code</button><button class="secondary" onclick="copyCode()">Copy</button><button class="secondary" onclick="location.reload()">Reset</button></div><div class="code" id="code">กด Generate Code</div></aside><main class="stage"><div id="preview" style="width:min(820px,100%)"></div></main></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmt(c){$('rp').focus();document.execCommand(c,false,null);render()}
function count(){let t=$('rp').innerText.trim(),w=0;if(t&&Intl.Segmenter)w=[...new Intl.Segmenter('th',{granularity:'word'}).segment(t)].filter(x=>x.isWordLike).length;else w=t?t.split(/\s+/).filter(Boolean).length:0;$('words').textContent=w+' WORDS';$('chars').textContent=t.replace(/\s/g,'').length+' CHARS'}
function val(id,out,s){$(out).textContent=$(id).value+s}
function render(){val('nameS','nameV','px');val('surS','surV','px');val('rpS','rpV','px');val('noteS','noteV','px');val('p1S','p1V','px');val('p2S','p2V','px');val('z1','z1V','×');val('z2','z2V','×');val('x1','x1V','%');val('y1','y1V','%');val('x2','x2V','%');val('y2','y2V','%');count();const p1=$('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg',p2=$('p2').value||p1,style='--title-size:'+$('nameS').value+'px;--sub-size:'+$('surS').value+'px;--rp-size:'+$('rpS').value+'px;--note-size:'+$('noteS').value+'px;--photo1:'+$('p1S').value+'px;--photo2:'+$('p2S').value+'px;--zoom1:'+$('z1').value+';--zoom2:'+$('z2').value+';--x1:'+$('x1').value+'%;--y1:'+$('y1').value+'%;--x2:'+$('x2').value+'%;--y2:'+$('y2').value+'%';$('preview').innerHTML='<link rel="stylesheet" href="https://smemories145-cpu.github.io/Tristianloveyou/rose-contact.css?v=1"><div class="film-page '+$('theme').value+'" style="'+style+'"><header class="film-head"><div><div class="film-meta">ROSE CONTACT SHEET / 35MM<br>PRIVATE SCENE ARCHIVE</div><div class="film-title">'+esc($('name').value)+'</div><div class="film-sub">'+esc($('sur').value)+'</div></div><div class="film-code">FRAME '+esc($('frame').value)+'<br>2026</div></header><section class="contact"><div><div class="frame one"><img src="'+esc(p1)+'"><span class="frame-no">01 / A</span></div><div class="scene">'+esc($('scene').value)+'</div></div><div><div class="frame two"><img src="'+esc(p2)+'"><span class="frame-no">02 / B</span></div><div class="scene">CUT / B-ROLL</div></div></section><div class="manuscript"><div class="scene-label">SCENE<br>TEXT</div><article class="rp-text">'+$('rp').innerHTML+'</article></div><div class="note-row"><b>NOTE</b><span>'+esc($('note').value)+'</span></div><footer class="film-foot"><span>'+esc($('motto').value)+'</span><span>ROSE / 35MM</span></footer></div>'}
function generate(){const style='--title-size:'+$('nameS').value+'px;--sub-size:'+$('surS').value+'px;--rp-size:'+$('rpS').value+'px;--note-size:'+$('noteS').value+'px;--photo1:'+$('p1S').value+'px;--photo2:'+$('p2S').value+'px;--zoom1:'+$('z1').value+';--zoom2:'+$('z2').value+';--x1:'+$('x1').value+'%;--y1:'+$('y1').value+'%;--x2:'+$('x2').value+'%;--y2:'+$('y2').value+'%';const p1=esc($('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg'),p2=esc($('p2').value||$('p1').value||'https://i.pinimg.com/1200x/d9/b2/a6/d9b2a6648292c95f31f5ad6242bd82a2.jpg');$('code').textContent='<link rel="stylesheet" href="https://smemories145-cpu.github.io/Tristianloveyou/rose-contact.css?v=1">\n<div class="film-page '+$('theme').value+'" style="'+style+'"><header class="film-head"><div><div class="film-meta">ROSE CONTACT SHEET / 35MM<br>PRIVATE SCENE ARCHIVE</div><div class="film-title">'+esc($('name').value)+'</div><div class="film-sub">'+esc($('sur').value)+'</div></div><div class="film-code">FRAME '+esc($('frame').value)+'<br>2026</div></header><section class="contact"><div><div class="frame one"><img src="'+p1+'"><span class="frame-no">01 / A</span></div><div class="scene">'+esc($('scene').value)+'</div></div><div><div class="frame two"><img src="'+p2+'"><span class="frame-no">02 / B</span></div><div class="scene">CUT / B-ROLL</div></div></section><div class="manuscript"><div class="scene-label">SCENE<br>TEXT</div><article class="rp-text">'+$('rp').innerHTML+'</article></div><div class="note-row"><b>NOTE</b><span>'+esc($('note').value)+'</span></div><footer class="film-foot"><span>'+esc($('motto').value)+'</span><span>ROSE / 35MM</span></footer></div>'}
function copyCode(){if($('code').textContent==='กด Generate Code')generate();if(navigator.clipboard)navigator.clipboard.writeText($('code').textContent)}
['theme','p1','p2','name','sur','scene','frame','motto','note','nameS','surS','rpS','noteS','p1S','p2S','z1','z2','x1','y1','x2','y2'].forEach(id=>$(id).addEventListener('input',render));$('rp').addEventListener('input',render);render();
</script></body></html>
