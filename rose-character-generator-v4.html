<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rose Character Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@300;400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&family=Sarabun:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#171313;color:#eee;font-family:"Noto Sans Thai",sans-serif}
.generator{width:1180px;max-width:calc(100vw - 32px);margin:22px auto;display:flex;flex-direction:row;align-items:flex-start;gap:18px}.panel{flex:0 0 350px;width:350px}.preview{flex:1 1 auto;min-width:0}
.panel,.preview{border:1px solid #ffffff18;background:#211b1b;border-radius:14px}.panel{padding:18px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}
.preview{min-height:700px;padding:24px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
h1{font:600 25px/1 "Cormorant Garamond";margin:0 0 5px}.desc{font-size:10px;color:#9f9590;margin-bottom:18px}
.group{padding:13px 0;border-top:1px solid #ffffff12}.group-title{font:8px "DM Mono";letter-spacing:.15em;color:#c97b80;margin-bottom:9px}
label{display:block;font-size:10px;color:#bdb3ae;margin:8px 0 4px}
input,textarea,select{width:100%;border:1px solid #ffffff16;background:#151111;color:#eee;border-radius:7px;padding:9px 10px;font:11px "Noto Sans Thai";outline:none}textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{border-color:#8d4a50}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.range{display:grid;grid-template-columns:1fr 45px;gap:8px;align-items:center}.range input{padding:0}.val{font:8px "DM Mono";color:#a89d98;text-align:right}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}.toolbar button,.actions button{border:1px solid #ffffff16;background:#171212;color:#cfc6c0;border-radius:5px;padding:6px 8px;font:9px "DM Mono";cursor:pointer}.toolbar button:hover{border-color:#9d5158}
.editor{min-height:120px;padding:10px;border:1px solid #ffffff16;background:#151111;border-radius:7px;font-size:11px;line-height:1.9;color:#eee;outline:none}.editor:focus{border-color:#8d4a50}.count{font:8px "DM Mono";color:#817772;text-align:right;margin-top:5px}
.actions{display:flex;gap:7px;margin-top:15px}.actions button{flex:1;border:0;padding:10px}.primary{background:#8a3b42!important;color:#fff!important}.secondary{background:#332a29!important;color:#ddd!important}
.output{margin-top:10px;width:100%;min-height:110px;font:9px/1.5 monospace;background:#110d0d;color:#bdb4ae;border:1px solid #ffffff12;border-radius:7px;padding:9px;display:none}
.rose-ui{--display-font:"Cormorant Garamond";--rose-bg:url("https://i.pinimg.com/736x/1a/f0/b9/1af0b9b1cba7168bd537f13ca18c26e0.jpg");--thai-font:"Noto Sans Thai";width:min(570px,100%);padding:0 18px 24px;position:relative;overflow:hidden;background:linear-gradient(180deg,#180b0b18,#10070712),var(--rose-bg) center/cover no-repeat;color:#292322;font-family:var(--thai-font),sans-serif;box-shadow:0 24px 55px #000a,0 5px 16px #0007}
.rose-ui:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff55;box-shadow:inset 0 0 35px #0002;pointer-events:none;z-index:1}.rose-ui:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,#ffffff30,transparent 28%),linear-gradient(90deg,#0003,transparent 20%,transparent 80%,#0003)}
.rose-ui>*{position:relative;z-index:3}.rose-top{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;color:#fff;text-shadow:0 1px 7px #000}.rose-top .left,.rose-top .right{font:7px "DM Mono";letter-spacing:.14em}.rose-top .right{text-align:right}.rose-top .center{width:5px;height:5px;border:1px solid #fff;transform:rotate(45deg)}
.rose-hero{position:relative;width:88%;height:225px;margin:0 auto;padding:8px;background:#f8f6f1;box-shadow:0 18px 32px #0008,0 3px 7px #0005;transform:translateY(0);transition:transform .25s,box-shadow .25s}.rose-hero img{width:100%;height:100%;display:block;object-fit:cover}.rose-hero:after{content:"";position:absolute;inset:8px;background:linear-gradient(180deg,transparent 50%,#0007);pointer-events:none}.rose-frame{position:absolute;left:18px;bottom:17px;color:#fff;font:7px "DM Mono";letter-spacing:.15em;text-shadow:0 1px 5px #000;z-index:4}
.rose-identity{position:relative;width:70%;margin:-22px auto 0;padding:13px 20px 12px;text-align:center;background:linear-gradient(180deg,#fffdf8f5,#eee8dfed);border:1px solid #ffffffb8;box-shadow:0 14px 25px #0005,0 3px 8px #0004;z-index:4;border-radius:2px}.rose-identity:after{content:"";position:absolute;inset:5px;border:1px solid #7d303625;pointer-events:none}.rose-kicker{color:#7d3036;font:6px "DM Mono";letter-spacing:.22em}.rose-name{font:600 34px/.95 var(--display-font),"Cormorant Garamond";color:#25201f;text-shadow:0 1px 0 #fff9}.rose-sub{margin-top:4px;color:#756b67;font:11px var(--display-font),"Cormorant Garamond";letter-spacing:.18em}.rose-divider{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.rose-divider span{width:17px;height:1px;background:#9b8580}.rose-divider i{width:4px;height:4px;border:1px solid #7d3036;transform:rotate(45deg)}
.rose-motto{width:82%;margin:13px auto 0;text-align:center;color:#fff;font:italic 12px/1.5 var(--display-font),"Cormorant Garamond";text-shadow:0 1px 7px #000}.rose-content{width:88%;margin:18px auto 0;display:flex;flex-direction:column;gap:11px}.rose-box{width:100%;padding:14px 17px;background:linear-gradient(145deg,#fffdf9f2,#eee7deeb);border:1px solid #ffffff75;box-shadow:0 13px 25px #0006,0 2px 6px #0003}.rose-box-head{display:flex;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid #29232220}.rose-box-title{color:#7d3036;font:8px "DM Mono";letter-spacing:.15em}.rose-box-no{color:#aaa19c;font:7px "DM Mono"}.rose-role{color:#393331;font-size:var(--rp-size,11px);line-height:1.95}.rose-role p{margin:0 0 9px}.rose-note{color:#625a56;font-size:var(--note-size,10px);line-height:1.8}.rose-note-line{width:26px;height:1px;margin-bottom:9px;background:#7d3036}.rose-bottom{width:82%;margin:13px auto 0;display:grid;grid-template-columns:1fr auto 1fr;color:#fff;text-shadow:0 1px 5px #000}.rose-bottom span{font:7px "DM Mono";letter-spacing:.14em}.rose-bottom span:last-child{text-align:right}.rose-dot{display:flex;gap:5px}.rose-dot i{width:4px;height:4px;border:1px solid #fff;border-radius:50%}.rose-dot i:first-child{background:#fff}
@media(max-width:620px){.generator{width:calc(100vw - 24px);max-width:none;margin:12px;display:flex;flex-direction:column}.panel{width:100%;flex:0 0 auto;max-height:none}.preview{width:100%;min-height:500px;flex:0 0 auto}}@media(max-width:520px){.row{grid-template-columns:1fr}.rose-name{font-size:30px}}
</style>
</head>
<body>
<div class="generator">
<section class="panel">
<h1>Rose Character</h1><div class="desc">ฟอร์มสร้างโปรไฟล์โรลเพลย์ · Live Preview</div>
<div class="group"><div class="group-title">BACKGROUND</div><label>URL รูปพื้นหลัง</label><input id="bg" value="https://i.pinimg.com/736x/1a/f0/b9/1af0b9b1cba7168bd537f13ca18c26e0.jpg"><label>URL รูปตัวละคร</label><input id="photo" placeholder="วาง URL รูปตัวละคร"></div>
<div class="group"><div class="group-title">CHARACTER</div><div class="row"><div><label>ชื่อ</label><input id="name" value="TRISTIAN"></div><div><label>นามสกุล</label><input id="sur" value="Sidney Kennedy"></div></div><label>Label</label><input id="label" value="CHARACTER"><label>คำโปรย / Motto</label><input id="motto" value="The wound is gone, but the pain remembers."></div>
<div class="group"><div class="group-title">TOP / FOOTER</div><div class="row"><div><label>ซ้ายบน</label><input id="topLeft" value="PRIVATE SCENE"></div><div><label>ขวาบน</label><input id="topRight" value="TRIS / 001"></div></div><div class="row"><div><label>ซ้ายล่าง</label><input id="footLeft" value="ROSE / MEMORY"></div><div><label>ขวาล่าง</label><input id="birthday" value="28 · 08 · 90"></div></div><label>ข้อความบนรูป</label><input id="frame" value="FRAME 01 · PORTRAIT"></div>
<div class="group"><div class="group-title">RP</div><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><button data-cmd="justifyLeft">L</button><button data-cmd="justifyCenter">C</button><button data-cmd="justifyRight">R</button><button data-cmd="insertUnorderedList">• LIST</button></div><div id="rp" class="editor" contenteditable="true"><p>ทริสเตียนยืนนิ่งอยู่ครู่หนึ่ง ปล่อยให้เสียงรอบตัวค่อย ๆ เงียบลง ก่อนจะหันกลับไปมองอีกฝ่ายด้วยรอยยิ้มบาง ๆ</p><p>“ไม่เป็นไรครับ... ทริสยังอยู่ตรงนี้”</p></div><div class="count" id="count">0 คำ</div></div>
<div class="group"><div class="group-title">NOTE</div><textarea id="note">รายละเอียดเล็ก ๆ ที่เกิดขึ้นระหว่างฉาก</textarea></div>
<div class="group"><div class="group-title">TYPOGRAPHY</div><label>ฟ้อนต์ช่องโรล · RP</label><select id="rpFont"><option value="Noto Sans Thai">Noto Sans Thai</option><option value="Prompt">Prompt</option><option value="Kanit">Kanit</option><option value="Sarabun">Sarabun</option><option value="IBM Plex Sans Thai">IBM Plex Sans Thai</option><option value="Playfair Display">Playfair Display</option><option value="Cormorant Garamond">Cormorant Garamond</option></select><label>ฟ้อนต์ Note</label><select id="noteFont"><option value="Noto Sans Thai">Noto Sans Thai</option><option value="Prompt">Prompt</option><option value="Kanit">Kanit</option><option value="Sarabun">Sarabun</option><option value="IBM Plex Sans Thai">IBM Plex Sans Thai</option></select><label>ฟ้อนต์ชื่อ · Display</label><select id="displayFont"><option value="Cormorant Garamond">Cormorant Garamond</option><option value="Playfair Display">Playfair Display</option><option value="DM Mono">DM Mono</option></select><label>ขนาดฟ้อนต์ RP</label><div class="range"><input id="rpSize" type="range" min="10" max="18" value="11"><span id="rpSizeV" class="val">11px</span></div><label>ขนาดฟ้อนต์ Note</label><div class="range"><input id="noteSize" type="range" min="9" max="16" value="10"><span id="noteSizeV" class="val">10px</span></div><label>ความสูงรูป</label><div class="range"><input id="photoH" type="range" min="170" max="330" value="225"><span id="photoHV" class="val">225px</span></div><label>ขนาดชื่อ</label><div class="range"><input id="nameSize" type="range" min="28" max="46" value="34"><span id="nameSizeV" class="val">34px</span></div></div></div>
<div class="actions"><button id="generate" class="primary">GENERATE CODE</button><button id="reset" class="secondary">RESET</button></div><button id="copy" class="secondary" style="width:100%;margin-top:7px">COPY CODE</button><textarea id="output" class="output" readonly></textarea>
</section>
<section class="preview"><div class="rose-ui" id="rosePreview">
<div class="rose-top"><div class="left" id="pTopLeft"></div><div class="center"></div><div class="right" id="pTopRight"></div></div>
<div class="rose-hero" id="pHero"><img id="pPhoto" src="https://placehold.co/900x600/241919/eee?text=CHARACTER"><div class="rose-frame" id="pFrame"></div></div>
<div class="rose-identity"><div class="rose-kicker" id="pLabel"></div><div class="rose-name" id="pName"></div><div class="rose-sub" id="pSur"></div><div class="rose-divider"><span></span><i></i><span></span></div></div>
<div class="rose-motto" id="pMotto"></div>
<div class="rose-content"><div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">SCENE</div><div class="rose-box-no">01</div></div><div class="rose-role" id="pRp"></div></div>
<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">NOTE</div><div class="rose-box-no">02</div></div><div class="rose-note"><div class="rose-note-line"></div><span id="pNote"></span></div></div></div>
<div class="rose-bottom"><span id="pFoot"></span><div class="rose-dot"><i></i><i></i><i></i></div><span id="pBirthday"></span></div>
</div></section>
</div>
<script>
(function(){
function $(id){return document.getElementById(id)}
function val(id){return $(id).value}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function countWords(s){return (s||'').trim().split(/\s+/).filter(Boolean).length}
function update(){
$('pTopLeft').textContent=val('topLeft');$('pTopRight').textContent=val('topRight');$('pFrame').textContent=val('frame');
$('pLabel').textContent=val('label');$('pName').textContent=val('name');$('pSur').textContent=val('sur');$('pMotto').textContent=val('motto');$('pFoot').textContent=val('footLeft');$('pBirthday').textContent=val('birthday');$('pNote').textContent=val('note');
$('pRp').innerHTML=$('rp').innerHTML;
$('rosePreview').style.setProperty('--rose-bg','url("'+val('bg').replace(/"/g,'')+'")');
var rpFont=val('rpFont');
var noteFont=val('noteFont');
var displayFont=val('displayFont');
$('rosePreview').style.setProperty('--rp-font','"'+rpFont+'"');
$('rosePreview').style.setProperty('--note-font','"'+noteFont+'"');
$('rosePreview').style.setProperty('--display-font','"'+displayFont+'"');
$('rosePreview').style.setProperty('--rp-size',val('rpSize')+'px');
$('rosePreview').style.setProperty('--note-size',val('noteSize')+'px');
$('pHero').style.height=val('photoH')+'px';
$('pName').style.fontSize=val('nameSize')+'px';
$('pName').style.fontFamily='"'+displayFont+'",serif';
$('pSur').style.fontFamily='"'+displayFont+'",serif';
$('pMotto').style.fontFamily='"'+displayFont+'",serif';
$('pRp').style.fontFamily='"'+rpFont+'",sans-serif';
$('pRp').style.fontSize=val('rpSize')+'px';
$('pNote').style.fontFamily='"'+noteFont+'",sans-serif';
$('pNote').style.fontSize=val('noteSize')+'px';
var img=val('photo');$('pPhoto').src=img||'https://placehold.co/900x600/241919/eee?text=CHARACTER';$('count').textContent=countWords($('rp').innerText)+' คำ';$('photoHV').textContent=val('photoH')+'px';$('nameSizeV').textContent=val('nameSize')+'px';$('rpSizeV').textContent=val('rpSize')+'px';$('noteSizeV').textContent=val('noteSize')+'px'
}
document.querySelectorAll('.panel input,.panel textarea,.panel select').forEach(function(el){el.addEventListener('input',update);el.addEventListener('change',update)});
document.querySelectorAll('.toolbar button').forEach(function(b){b.addEventListener('click',function(){document.execCommand(b.dataset.cmd,false,null);$('rp').focus();update()})});
$('generate').addEventListener('click',function(){
var d={bg:val('bg'),photo:val('photo'),name:val('name'),sur:val('sur'),label:val('label'),motto:val('motto'),topLeft:val('topLeft'),topRight:val('topRight'),footLeft:val('footLeft'),birthday:val('birthday'),frame:val('frame'),rp:$('rp').innerHTML,note:val('note'),photoH:val('photoH'),nameSize:val('nameSize'),rpFont:val('rpFont'),noteFont:val('noteFont'),displayFont:val('displayFont'),rpSize:val('rpSize'),noteSize:val('noteSize')};
var css=`
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@300;400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@300;400;500;600&family=Sarabun:wght@400;500;600&display=swap');
.rose-ui{--rp-font:"${esc(d.rpFont)}";--note-font:"${esc(d.noteFont)}";--display-font:"${esc(d.displayFont)}";width:min(570px,100%);margin:14px auto;padding:0 18px 24px;position:relative;overflow:hidden;background:linear-gradient(180deg,#180b0b18,#10070712),url("${esc(d.bg)}") center/cover no-repeat;color:#292322;font-family:var(--thai-font),sans-serif;box-shadow:0 24px 55px #000a,0 5px 16px #0007}
.rose-ui:before{content:"";position:absolute;inset:9px;border:1px solid #ffffff55;box-shadow:inset 0 0 35px #0002;pointer-events:none;z-index:1}.rose-ui:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,#ffffff30,transparent 28%),linear-gradient(90deg,#0003,transparent 20%,transparent 80%,#0003)}.rose-ui>*{position:relative;z-index:3}
.rose-top{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;color:#fff;text-shadow:0 1px 7px #000}.rose-top .left,.rose-top .right{font:7px "DM Mono";letter-spacing:.14em}.rose-top .right{text-align:right}.rose-top .center{width:5px;height:5px;border:1px solid #fff;transform:rotate(45deg)}
.rose-hero{position:relative;width:88%;height:${esc(d.photoH)}px;margin:0 auto;padding:8px;background:#f8f6f1;box-shadow:0 18px 32px #0008,0 3px 7px #0005}.rose-hero img{width:100%;height:100%;display:block;object-fit:cover}.rose-hero:after{content:"";position:absolute;inset:8px;background:linear-gradient(180deg,transparent 50%,#0007);pointer-events:none}.rose-frame{position:absolute;left:18px;bottom:17px;color:#fff;font:7px "DM Mono";letter-spacing:.15em;text-shadow:0 1px 5px #000;z-index:4}
.rose-identity{position:relative;width:70%;margin:-22px auto 0;padding:13px 20px 12px;text-align:center;background:linear-gradient(180deg,#fffdf8f5,#eee8dfed);border:1px solid #ffffffb8;box-shadow:0 14px 25px #0005,0 3px 8px #0004;z-index:4;border-radius:2px}.rose-identity:after{content:"";position:absolute;inset:5px;border:1px solid #7d303625;pointer-events:none}.rose-kicker{color:#7d3036;font:6px "DM Mono";letter-spacing:.22em}.rose-name{font:600 ${esc(d.nameSize)}px/.95 var(--display-font),"Cormorant Garamond";color:#25201f;text-shadow:0 1px 0 #fff9}.rose-sub{margin-top:4px;color:#756b67;font:11px var(--display-font),"Cormorant Garamond";letter-spacing:.18em}.rose-divider{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.rose-divider span{width:17px;height:1px;background:#9b8580}.rose-divider i{width:4px;height:4px;border:1px solid #7d3036;transform:rotate(45deg)}
.rose-motto{width:82%;margin:13px auto 0;text-align:center;color:#fff;font:italic 12px/1.5 var(--display-font),"Cormorant Garamond";text-shadow:0 1px 7px #000}.rose-content{width:88%;margin:18px auto 0;display:flex;flex-direction:column;gap:11px}.rose-box{width:100%;padding:14px 17px;background:linear-gradient(145deg,#fffdf9f2,#eee7deeb);border:1px solid #ffffff75;box-shadow:0 13px 25px #0006,0 2px 6px #0003}.rose-box-head{display:flex;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid #29232220}.rose-box-title{color:#7d3036;font:8px "DM Mono";letter-spacing:.15em}.rose-box-no{color:#aaa19c;font:7px "DM Mono"}.rose-role{color:#393331;font-family:var(--rp-font),sans-serif;font-size:${esc(d.rpSize)}px;line-height:1.95}.rose-role p{margin:0 0 9px}.rose-note{color:#625a56;font-family:var(--note-font),sans-serif;font-size:${esc(d.noteSize)}px;line-height:1.8}.rose-note-line{width:26px;height:1px;margin-bottom:9px;background:#7d3036}.rose-bottom{width:82%;margin:13px auto 0;display:grid;grid-template-columns:1fr auto 1fr;color:#fff;text-shadow:0 1px 5px #000}.rose-bottom span{font:7px "DM Mono";letter-spacing:.14em}.rose-bottom span:last-child{text-align:right}.rose-dot{display:flex;gap:5px}.rose-dot i{width:4px;height:4px;border:1px solid #fff;border-radius:50%}.rose-dot i:first-child{background:#fff}
@media(max-width:520px){.rose-ui{padding:0 12px 20px}.rose-name{font-size:30px}.rose-content{width:88%}}
`;
var code='<style>'+css+'</style>\n<div class="rose-ui">\n'+
'<div class="rose-top"><div class="left">'+esc(d.topLeft)+'</div><div class="center"></div><div class="right">'+esc(d.topRight)+'</div></div>\n'+
'<div class="rose-hero"><img src="'+esc(d.photo||'https://placehold.co/900x600/241919/eee?text=CHARACTER')+'"><div class="rose-frame">'+esc(d.frame)+'</div></div>\n'+
'<div class="rose-identity"><div class="rose-kicker">'+esc(d.label)+'</div><div class="rose-name">'+esc(d.name)+'</div><div class="rose-sub">'+esc(d.sur)+'</div><div class="rose-divider"><span></span><i></i><span></span></div></div>\n'+
'<div class="rose-motto">'+esc(d.motto)+'</div>\n'+
'<div class="rose-content"><div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">SCENE</div></div><div class="rose-role">'+d.rp+'</div></div>\n'+
'<div class="rose-box"><div class="rose-box-head"><div class="rose-box-title">NOTE</div></div><div class="rose-note"><div class="rose-note-line"></div><span>'+esc(d.note)+'</span></div></div></div>\n'+
'<div class="rose-bottom"><span>'+esc(d.footLeft)+'</span><div class="rose-dot"><i></i><i></i><i></i></div><span>'+esc(d.birthday)+'</span></div>\n</div>';
$('output').value=code;$('output').style.display='block'
});
$('copy').addEventListener('click',function(){if(!$('output').value)$('generate').click();$('output').select();document.execCommand('copy')});
$('reset').addEventListener('click',function(){location.reload()});
update()
})();
</script>
</body></html>
