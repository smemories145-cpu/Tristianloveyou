<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Gallery Generator</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#171616;color:#eee;font-family:Montserrat,Arial}.app{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:350px 1fr;gap:28px}.panel{background:#232121;border:1px solid #3b3735;padding:22px}.panel h1{font-family:"Cormorant Garamond";font-size:30px;margin:0 0 5px}.hint{font-size:12px;color:#aaa;line-height:1.7;margin-bottom:20px}.field{margin:13px 0}.field label{display:block;font-size:11px;letter-spacing:1px;color:#b9aaa0;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;background:#171616;color:#eee;border:1px solid #4a4542;padding:10px;font:13px Montserrat}.code{margin-top:18px;width:100%;height:180px;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #4a4542;padding:12px;font:11px monospace;resize:vertical}.copy{width:100%;margin-top:10px;padding:11px;border:0;background:#d9c7b7;color:#28211e;font-weight:bold;cursor:pointer}.preview{overflow:auto;padding:20px;background:#0f0f10}.preview-title{font-size:11px;letter-spacing:2px;color:#a99c92;margin-bottom:10px}.tr-gallery{width:760px;max-width:100%;margin:0 auto;position:relative;padding:14px;box-sizing:border-box;background:linear-gradient(135deg,#f7f6f4,#e9e7e5);border:2px solid #2e2d2c;box-shadow:0 12px 32px rgba(0,0,0,.18),inset 0 0 0 5px rgba(255,255,255,.65);font-family:Montserrat;overflow:hidden;zoom:.7}.tr-gallery:before{content:"";position:absolute;inset:7px;border:1px solid rgba(92,82,75,.28);pointer-events:none;z-index:10}.tr-gallery-inner{display:grid;grid-template-columns:155px 1fr;gap:16px;position:relative;z-index:2}.tr-left-photo{height:205px;background-position:var(--left-x,center) var(--left-y,center);background-size:var(--left-size,cover);background-image:linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.04)),var(--left-photo);border:4px solid #252525;box-shadow:0 6px 16px rgba(0,0,0,.16);position:relative}.tr-left-photo:before{content:var(--tag,"VAMPIRE");position:absolute;left:0;bottom:0;padding:7px 10px;background:#1e1d1cb8;color:#fff;font-size:7px;letter-spacing:2px}.tr-right-area{height:205px;position:relative;border:4px solid #252525;overflow:hidden}.tr-main-photo{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(255,255,255,.04),rgba(0,0,0,.12)),var(--main-photo);background-position:var(--main-x,center) var(--main-y,center);background-size:var(--main-size,cover)}.tr-name{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:68%;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 20px;box-sizing:border-box;color:#35312e;font-family:"Cormorant Garamond";font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#fff,#edeae7);border:4px solid #252525;z-index:5}.tr-name small{display:block;margin-top:3px;font-family:Montserrat;font-size:7px;letter-spacing:3px;color:#978b82}.tr-glitter{position:absolute;inset:0;pointer-events:none}.tr-glitter span{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;animation:twinkle 2.6s infinite}.tr-glitter span:nth-child(1){top:12%;left:6%}.tr-glitter span:nth-child(2){top:28%;left:38%;animation-delay:1.1s}.tr-glitter span:nth-child(3){top:9%;right:16%;animation-delay:.7s}.tr-glitter span:nth-child(4){top:65%;left:22%;animation-delay:1.8s}.tr-glitter span:nth-child(5){bottom:12%;right:9%;animation-delay:.4s}.tr-glitter span:nth-child(6){bottom:25%;left:62%;animation-delay:1.4s}.tr-glitter span:nth-child(7){top:48%;right:31%;animation-delay:2.1s}.tr-glitter span:nth-child(8){top:76%;left:8%;animation-delay:.9s}@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}@media(max-width:850px){.app{grid-template-columns:1fr}.tr-gallery{zoom:.55}}@media(max-width:600px){.app{padding:14px}.tr-gallery{zoom:.42}}</style><div class="app"><section class="panel"><h1>Vampire Gallery Generator</h1><div class="hint">กรอกข้อมูล → ดูตัวอย่าง → Copy โค้ด ✦</div><div class="field"><label>รูปฝั่งซ้าย</label><input id="left"></div><div class="field"><label>รูปฝั่งขวา</label><input id="main"></div><div class="field"><label>ชื่อ</label><input id="name" value="YOUR NAME"></div><div class="field"><label>ข้อความใต้ชื่อ</label><input id="sub" value="YOUR PERSONAL QUOTE"></div><div class="field"><label>ข้อความป้ายซ้าย</label><input id="tag" value="VAMPIRE"></div><div class="field"><label>สีพื้นหลัง</label><input id="bg" type="color" value="#f7f6f4"></div><div class="field"><label>สีข้อความชื่อ</label><input id="namecolor" type="color" value="#35312e"></div><div class="field"><label>ตำแหน่งรูปซ้าย แนวนอน</label><input id="leftx" type="range" min="0" max="100" value="50"></div><div class="field"><label>ตำแหน่งรูปซ้าย แนวตั้ง</label><input id="lefty" type="range" min="0" max="100" value="50"></div><div class="field"><label>ซูมรูปซ้าย</label><input id="leftzoom" type="range" min="100" max="250" value="100"></div><div class="field"><label>ตำแหน่งรูปขวา แนวนอน</label><input id="mainx" type="range" min="0" max="100" value="50"></div><div class="field"><label>ตำแหน่งรูปขวา แนวตั้ง</label><input id="mainy" type="range" min="0" max="100" value="50"></div><div class="field"><label>ซูมรูปขวา</label><input id="mainzoom" type="range" min="100" max="250" value="100"></div><div class="field"><label>ขนาดชื่อ</label><input id="namesize" type="range" min="14" max="40" value="20"></div><textarea id="code" class="code" readonly></textarea><button class="copy" onclick="navigator.clipboard.writeText(code.value);this.textContent='COPIED ✦';setTimeout(()=>this.textContent='COPY CODE',1200)">COPY CODE</button></section><section><div class="preview-title">LIVE PREVIEW</div><div class="preview"><div class="tr-gallery" id="card"><div class="tr-gallery-inner"><div class="tr-left-photo"></div><div class="tr-right-area"><div class="tr-main-photo"></div><div class="tr-name"><span id="pname"></span><small id="psub"></small></div></div></div><div class="tr-glitter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></section></div><script>const $=x=>document.getElementById(x),ids=['left','main','name','sub','tag','bg','namecolor','leftx','lefty','leftzoom','mainx','mainy','mainzoom','namesize'];function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function build(){let v={};ids.forEach(x=>v[x]=$(x).value);document.documentElement.style.setProperty('--tag','"'+v.tag.replace(/"/g,'')+'"');$('pname').textContent=v.name;$('psub').textContent=v.sub;document.documentElement.style.setProperty('--tag',v.tag);$('card').style.cssText='--left-photo:url("'+v.left.replace(/"/g,'%22')+'");--main-photo:url("'+v.main.replace(/"/g,'%22')+'");--left-x:'+v.leftx+'%;--left-y:'+v.lefty+'%;--left-size:'+v.leftzoom+'%;--main-x:'+v.mainx+'%;--main-y:'+v.mainy+'%;--main-size:'+v.mainzoom+'%;background:'+v.bg+';';document.querySelector('.tr-left-photo:before');document.querySelector('.tr-name').style.color=v.namecolor;document.querySelector('.tr-name').style.fontSize=v.namesize+'px';$('code').value='<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/smemories145-cpu/Tristianloveyou@main/vampire-gallery.css"><div class="tr-gallery" style="--left-photo:url('+v.left+');--main-photo:url('+v.main+');"><div class="tr-gallery-inner"><div class="tr-left-photo"></div><div class="tr-right-area"><div class="tr-main-photo"></div><div class="tr-name"><span>'+e(v.name)+'<br><small>'+e(v.sub)+'</small></span></div></div></div><div class="tr-glitter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>'}ids.forEach(x=>$(x).addEventListener('input',build));build();</script>
