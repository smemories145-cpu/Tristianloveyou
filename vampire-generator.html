<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vampire Gallery Generator</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/smemories145-cpu/Tristianloveyou@940d71ca07f3662116cccf2c1cfa3b11fe74ce70/vampire-gallery.css"><style>body{margin:0;background:#171616;color:#eee;font-family:Montserrat,Arial}.app{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:360px 1fr;gap:28px}.panel{background:#232121;border:1px solid #3b3735;padding:22px}.panel h1{font-family:"Cormorant Garamond";font-size:30px;margin:0 0 5px}.hint{font-size:12px;color:#aaa;line-height:1.7;margin-bottom:20px}.field{margin:13px 0}.field label{display:block;font-size:11px;letter-spacing:1px;color:#b9aaa0;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;background:#171616;color:#eee;border:1px solid #4a4542;padding:10px;font:13px Montserrat}.field input[type=range]{padding:0}.code{margin-top:18px;width:100%;height:190px;box-sizing:border-box;background:#111;color:#ddd;border:1px solid #4a4542;padding:12px;font:11px monospace;resize:vertical}.copy{width:100%;margin-top:10px;padding:11px;border:0;background:#d9c7b7;color:#28211e;font-weight:bold;cursor:pointer}.preview{overflow:auto;padding:20px;background:#0f0f10}.preview-title{font-size:11px;letter-spacing:2px;color:#a99c92;margin-bottom:10px}@media(max-width:850px){.app{grid-template-columns:1fr}.tr-gallery{zoom:.55}}@media(max-width:600px){.app{padding:14px}.tr-gallery{zoom:.42}}</style></head><body><div class="app"><section class="panel"><h1>Vampire Gallery Generator</h1><div class="hint">กรอกข้อมูล → ดูตัวอย่าง → Copy โค้ด ✦</div><div class="field"><label>รูปฝั่งซ้าย</label><input id="left"></div><div class="field"><label>รูปฝั่งขวา</label><input id="main"></div><div class="field"><label>ชื่อ</label><input id="name" value="YOUR NAME"></div><div class="field"><label>ข้อความใต้ชื่อ</label><input id="sub" value="YOUR PERSONAL QUOTE"></div><div class="field"><label>ข้อความป้ายซ้าย</label><input id="tag" value="VAMPIRE"></div><div class="field"><label>ข้อความมุมขวาบน</label><input id="quote" value="Sometimes, that's just how life is."></div><div class="field"><label>สีพื้นหลัง</label><input id="bg" type="color" value="#f7f6f4"></div><div class="field"><label>สีข้อความชื่อ</label><input id="namecolor" type="color" value="#35312e"></div><div class="field"><label>ตำแหน่งรูปซ้าย แนวนอน</label><input id="leftx" type="range" min="0" max="100" value="50"></div><div class="field"><label>ตำแหน่งรูปซ้าย แนวตั้ง</label><input id="lefty" type="range" min="0" max="100" value="50"></div><div class="field"><label>ซูมรูปซ้าย</label><input id="leftzoom" type="range" min="100" max="250" value="100"></div><div class="field"><label>ตำแหน่งรูปขวา แนวนอน</label><input id="mainx" type="range" min="0" max="100" value="50"></div><div class="field"><label>ตำแหน่งรูปขวา แนวตั้ง</label><input id="mainy" type="range" min="0" max="100" value="50"></div><div class="field"><label>ซูมรูปขวา</label><input id="mainzoom" type="range" min="100" max="250" value="100"></div><div class="field"><label>ขนาดชื่อ</label><input id="namesize" type="range" min="14" max="40" value="20"></div><textarea id="code" class="code" readonly></textarea><button class="copy" id="copy">COPY CODE</button></section><section><div class="preview-title">LIVE PREVIEW</div><div class="preview"><div class="tr-gallery" id="card"><div class="tr-gallery-inner"><div class="tr-left-photo"><div class="tr-left-label" id="ptag"></div><div class="tr-left-stars">✦ · ✧</div></div><div class="tr-right-area"><div class="tr-main-photo"></div><div class="tr-main-stars">✦ ✧ · ✦ ✧</div><div class="tr-quote" id="pquote"></div><div class="tr-name"><div class="tr-name-inner"><span class="tr-name-title" id="pname"></span><span class="tr-name-sub" id="psub"></span></div><span class="tr-name-shine"></span></div></div></div><div class="tr-glitter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></section></div><script>const $=id=>document.getElementById(id),ids=["left","main","name","sub","tag","quote","bg","namecolor","leftx","lefty","leftzoom","mainx","mainy","mainzoom","namesize"],esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");function build(){const v={};ids.forEach(id=>v[id]=$(id).value);pname.textContent=v.name;psub.textContent=v.sub;ptag.textContent=v.tag;pquote.textContent=v.quote;const u=s=>s.replace(/"/g,"%22");const style="--left-photo:url("+u(v.left)+");--main-photo:url("+u(v.main)+");--left-x:"+v.leftx+"%;--left-y:"+v.lefty+"%;--left-size:"+v.leftzoom+"%;--main-x:"+v.mainx+"%;--main-y:"+v.mainy+"%;--main-size:"+v.mainzoom+"%;--bg:"+v.bg+";--name-color:"+v.namecolor+";--name-size:"+v.namesize+"px;";card.style.cssText=style;code.value='<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/smemories145-cpu/Tristianloveyou@940d71ca07f3662116cccf2c1cfa3b11fe74ce70/vampire-gallery.css"><div class="tr-gallery" style="'+style+'"><div class="tr-gallery-inner"><div class="tr-left-photo"><div class="tr-left-label">'+esc(v.tag)+'</div><div class="tr-left-stars">✦ · ✧</div></div><div class="tr-right-area"><div class="tr-main-photo"></div><div class="tr-main-stars">✦ ✧ · ✦ ✧</div><div class="tr-quote">'+esc(v.quote)+'</div><div class="tr-name"><div class="tr-name-inner"><span class="tr-name-title">'+esc(v.name)+'</span><span class="tr-name-sub">'+esc(v.sub)+'</span></div><span class="tr-name-shine"></span></div></div></div><div class="tr-glitter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>'}ids.forEach(id=>$(id).addEventListener("input",build));copy.onclick=()=>navigator.clipboard.writeText(code.value).then(()=>{copy.textContent="COPIED ✦";setTimeout(()=>copy.textContent="COPY CODE",1200)});build();</script></body></html>
