<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxury Roleplay Generator</title><link rel="stylesheet" href="./lux-role.css?v=3"><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500&display=swap');*{box-sizing:border-box}body{margin:0;background:#090e11;color:#ddd;font-family:"Noto Sans Thai",Montserrat,sans-serif}.app{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;min-height:100vh;padding:22px}.panel{position:sticky;top:22px;height:calc(100vh - 44px);overflow:auto;background:#11191d;border:1px solid #2a3539;border-radius:14px;padding:20px;box-shadow:0 15px 40px #0008}.panel h1{margin:0 0 5px;font:600 25px Georgia,serif;letter-spacing:1px}.sub{font-size:11px;color:#8d9998;margin-bottom:18px}.field{margin:13px 0}.field label{display:block;font-size:11px;color:#aeb8b5;margin-bottom:6px}.field input[type=text],.field textarea{width:100%;background:#0b1114;color:#eee;border:1px solid #303c40;border-radius:8px;padding:10px;font:13px "Noto Sans Thai",sans-serif;outline:0}.field textarea{min-height:125px;resize:vertical}.toolbar{display:flex;gap:5px;flex-wrap:wrap;background:#0b1114;border:1px solid #303c40;border-radius:8px;padding:6px}.toolbar button,.btn{border:1px solid #39474b;background:#172125;color:#dce3df;border-radius:6px;padding:7px 9px;cursor:pointer}.toolbar button:hover,.btn:hover{background:#223136}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range{display:flex;align-items:center;gap:8px}.range input{width:100%}.range span{width:42px;text-align:right;font-size:11px;color:#9aa5a2}.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{display:flex;align-items:center;gap:8px;font-size:10px;color:#aeb8b5}.color input{width:34px;height:28px;padding:0;border:0;background:none}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.primary{background:#b9cbbd!important;color:#111!important;border-color:#b9cbbd!important}.clear{font-size:11px}.out{margin-top:14px;width:100%;height:90px;background:#0b1114;color:#aeb8b5;border:1px solid #303c40;border-radius:8px;padding:9px;font:11px monospace}.preview{min-width:0;padding:25px;background:#0d1418;border:1px solid #222d31;border-radius:14px;overflow:auto}.preview-head{font-size:10px;letter-spacing:3px;color:#7f8c89;margin:0 0 12px}.hint{font-size:10px;color:#65716f;text-align:center;margin-top:12px}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:relative;top:0;height:auto}.preview{padding:10px}}</style></head><body><div class="app"><aside class="panel"><h1>LUXURY ROLEPLAY</h1><div class="sub">สร้างโค้ดโรลเพลย์แบบหรู พร้อมดูตัวอย่างแบบสด</div><div class="field"><label>รูปพื้นหลัง</label><input id="img" type="text" placeholder="https://...jpg"></div><div class="row"><div class="field"><label>Zoom</label><div class="range"><input id="zoom" type="range" min="80" max="180" value="100"><span id="zoomV">100%</span></div></div><div class="field"><label>ตำแหน่ง X</label><div class="range"><input id="x" type="range" min="0" max="100" value="50"><span id="xV">50%</span></div></div></div><div class="field"><label>ตำแหน่ง Y</label><div class="range"><input id="y" type="range" min="0" max="100" value="50"><span id="yV">50%</span></div></div><div class="field"><label>ชื่อ / TITLE</label><input id="title" type="text" value="TRISTIAN S. KENNEDY"></div><div class="field"><label>ข้อความโรลเพลย์</label><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><button data-cmd="justifyLeft">≡←</button><button data-cmd="justifyCenter">≡</button><button data-cmd="justifyRight">→≡</button><button data-cmd="justifyFull">☰</button></div><div id="role" contenteditable="true" style="min-height:125px;background:#0b1114;border:1px solid #303c40;border-top:0;border-radius:0 0 8px 8px;padding:10px;font-size:13px;line-height:1.9;outline:0;text-align:justify">ใส่ข้อความโรลเพลย์ตรงนี้</div></div><div class="field"><label>หมายเหตุ</label><input id="note" type="text" placeholder="ใส่ข้อความหมายเหตุตรงนี้"></div><div class="field"><label>ลายเซ็น</label><input id="sign" type="text" value="— Iloveyoubaby"></div><div class="field"><label>คำพูดด้านบนขวา</label><input id="quote" type="text" value="SOMETIMES, THAT'S JUST HOW LIFE IS."></div><div class="field"><label>สี</label><div class="colors"><div class="color"><input id="titleC" type="color" value="#f2eee5"> Title</div><div class="color"><input id="textC" type="color" value="#e1e1dc"> Text</div><div class="color"><input id="panelC" type="color" value="#0a1316"> Panel</div><div class="color"><input id="accentC" type="color" value="#b9cbbd"> Accent</div></div></div><div class="actions"><button class="btn primary" id="gen">GENERATE CODE</button><button class="btn clear" id="clear">CLEAR</button></div><textarea class="out" id="out" readonly placeholder="โค้ดจะขึ้นตรงนี้..."></textarea><button class="btn" id="copy" style="width:100%;margin-top:8px">COPY CODE</button></aside><main class="preview"><div class="preview-head">LIVE PREVIEW</div><div id="preview"></div><div class="hint">Preview ใช้ CSS ชุดเดียวกับโค้ดที่ Generate</div></main></div><script>const $=id=>document.getElementById(id),css='https://smemories145-cpu.github.io/Tristianloveyou/lux-role.css?v=3';let stateKey='luxury-roleplay-generator';function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function vars(){return `--lux-bg:url('${$('img').value||'https://i.pinimg.com/1200x/4f/3a/d5/4f3ad50febc7399ec5c9a947c27b8296.jpg'}');--lux-zoom:${$('zoom').value}%;--lux-x:${$('x').value}%;--lux-y:${$('y').value}%;--lux-title:${$('titleC').value};--lux-role-text:${$('textC').value};--lux-panel:rgba(${parseInt($('panelC').value.slice(1,3),16)},${parseInt($('panelC').value.slice(3,5),16)},${parseInt($('panelC').value.slice(5,7),16)},.68);--lux-accent:${$('accentC').value}`}function markup(){return `<div class="lux-role" style="${vars()}"><div class="lux-bg"><div class="lux-quote">${esc($('quote').value)}</div><div class="lux-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="lux-content"><div class="lux-title">${esc($('title').value)}</div><div class="lux-text">${$('role').innerHTML}</div>${$('note').value?`<div class="lux-note">${esc($('note').value)}</div>`:''}<div class="lux-sign">${esc($('sign').value)}</div></div></div></div>`}function render(){let p=$('preview');p.innerHTML=markup();['zoom','x','y'].forEach(k=>$(k+'V').textContent=$(k).value+'%');localStorage.setItem(stateKey,JSON.stringify({img:$('img').value,title:$('title').value,role:$('role').innerHTML,note:$('note').value,sign:$('sign').value,quote:$('quote').value,zoom:$('zoom').value,x:$('x').value,y:$('y').value,titleC:$('titleC').value,textC:$('textC').value,panelC:$('panelC').value,accentC:$('accentC').value}))}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',render));$('role').addEventListener('input',render);document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();document.execCommand(b.dataset.cmd,false,null);$('role').focus();render()}));$('gen').onclick=()=>{$('out').value=`<link rel="stylesheet" href="${css}"><style>/* Generated by Luxury Roleplay Generator */</style>${markup()}`};$('copy').onclick=async()=>{if(!$('out').value)$('gen').click();await navigator.clipboard.writeText($('out').value);$('copy').textContent='COPIED ✓';setTimeout(()=>$('copy').textContent='COPY CODE',1200)};$('clear').onclick=()=>{localStorage.removeItem(stateKey);location.reload()};try{let d=JSON.parse(localStorage.getItem(stateKey));if(d)Object.keys(d).forEach(k=>$(k)&&($(k).value=d[k]));}catch(e){}render();</script></body></html>
