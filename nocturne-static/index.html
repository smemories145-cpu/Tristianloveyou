<!doctype html><html lang=th><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>NOCTURNE Writer</title><meta name=referrer content=no-referrer><meta name=robots content=noindex,nofollow><style>*{box-sizing:border-box}body{margin:0;background:#0e0e0f;color:#eae8e5;font:14px system-ui,Tahoma}button,select,input,textarea{font:inherit;background:#202022;color:inherit;border:1px solid #3b3b3c;border-radius:7px;padding:10px}button{cursor:pointer}button:hover{background:#333}textarea,input,select{width:100%}textarea{resize:vertical;line-height:1.9}header{padding:18px 25px;border-bottom:1px solid #333;display:flex;justify-content:space-between;gap:12px;align-items:center}strong.logo{font:26px Georgia;letter-spacing:3px}main{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;min-height:90vh}aside{background:#151516;padding:18px;border-right:1px solid #333}aside:last-child{border-right:0;border-left:1px solid #333}article{padding:26px min(4vw,50px)}h1{font:32px Georgia}h2{font-size:13px;letter-spacing:1px}label{display:block;margin:12px 0 5px;color:#aaa;font-size:12px}.item{display:block;width:100%;text-align:left;margin:8px 0}.active{background:#4a4846}.editor{min-height:440px;border:0;background:transparent;font:17px/2.1 Georgia,'Noto Serif Thai',serif}.card{padding:16px;background:#19191b;border:1px solid #3b3b3b;border-radius:12px;margin-top:25px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.primary{background:#d8d5cf;color:#121212;border-color:#d8d5cf}.hint{color:#aaa;font-size:12px;line-height:1.8}.memory{border:1px solid #333;padding:10px;margin:8px 0;white-space:pre-wrap;font-size:12px}#login{position:fixed;inset:0;background:#0d0d0e;display:grid;place-items:center;z-index:9}#login>div{background:#1c1c1d;border:1px solid #3c3c3d;padding:35px;border-radius:14px;width:min(380px,90vw)}#notice{white-space:pre-wrap;line-height:1.9;max-height:500px;overflow:auto}.hidden{display:none!important}@media(max-width:900px){main{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #333}article{padding:20px}}</style>
<div id=login><div><strong class=logo>✦ NOCTURNE</strong><p>Private Writing Studio · Midnight Black</p><input id=password type=password placeholder="รหัสผ่าน"><p><button id=enter class=primary>เข้าสู่ระบบ</button></p><p id=loginError class=hint></p></div></div>
<header><strong class=logo>✦ NOCTURNE</strong><span id=status class=hint>Private Writing Studio</span><button id=logout>ออกจากระบบ</button></header><main><aside><h2>STORIES</h2><button id=newStory>＋ เรื่องใหม่</button><div id=storyList></div><h2>CHAPTERS</h2><button id=newChapter>＋ เพิ่มบท</button><div id=chapterList></div><button id=backup>⇩ สำรอง JSON</button><p><button id=restore>↑ นำเข้า JSON</button><input id=restoreFile type=file accept=.json class=hidden></p></aside>
<article><input id=title placeholder="ชื่อเรื่อง" style="font:30px Georgia;background:transparent;border:0"><input id=chapterTitle placeholder="ชื่อบท" style="background:transparent;border:0"><textarea id=editor class=editor placeholder="เริ่มเขียนนิยายที่นี่..."></textarea><p id=saveStatus class=hint>บันทึกอัตโนมัติ</p><div class=card><h2>✧ AI WRITING COMPANION</h2><textarea id=prompt placeholder="คำสั่งให้ AI ช่วยเขียนต่อ หรือเกลาฉาก" rows=3></textarea><div class=row><select id=mode><option value=continue>เขียนต่อ</option><option value=rewrite>เกลาช่วงท้าย</option><option value=ideas>เสนอพล็อต</option></select><select id=size><option value=900>สั้น</option><option value=1700 selected>ปานกลาง</option><option value=2600>ยาว</option></select><button id=generate class=primary>✧ ให้ AI เขียน</button></div><div id=resultBox class=hidden><h2>ข้อความจาก AI</h2><div id=notice></div><p><button id=accept class=primary>รับข้อความเข้าต้นฉบับ</button><button id=dismiss>ปิด</button></p></div></div></article>
<aside><h2>AI MODEL</h2><label>ผู้ให้บริการ</label><select id=provider><option value=horde>AI Horde · Anonymous Free</option><option value=kyrune>Kyrune Mini · Free key</option><option value=meganova>MegaNova Euryale · Free quota</option></select><label>โมเดล</label><select id=model></select><button id=refreshModels>โหลดรายชื่อโมเดล</button><label>API Key (ไม่บันทึกลงฐานข้อมูล)</label><input id=apiKey type=password placeholder="AI Horde ไม่ต้องใช้คีย์"><p class=hint>การสร้างข้อความขึ้นกับนโยบายและโควตาของผู้ให้บริการ AI</p><h2>STORY BIBLE</h2><label>แนวเรื่องและเรื่องย่อ</label><textarea id=synopsis rows=4></textarea><label>ตัวละครและความสัมพันธ์</label><textarea id=characters rows=6></textarea><label>CANON ที่ห้ามขัดแย้ง</label><textarea id=canon rows=6></textarea><label>ไทม์ไลน์</label><textarea id=timeline rows=5></textarea><h2>MEMORIES</h2><textarea id=memoryText rows=3 placeholder="ข้อเท็จจริงที่ต้องจำ"></textarea><button id=addMemory>＋ ปักหมุด</button><div id=memoryList></div></aside></main>
<script>
const $=x=>document.getElementById(x);const fields=['synopsis','characters','canon','timeline'];let pw=sessionStorage.pw||'',items=[],story=null,idx=0,timer,proposal='',usedMode='';
async function api(data){const r=await fetch('https://rkoqdgkqibnjmnhvpufj.supabase.co/functions/v1/nocturne-writer',{method:'POST',headers:{'content-type':'application/json','x-nocturne-password':pw},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function error(e){alert(e.message||e)}function render(){const a=$('storyList');a.replaceChildren();items.forEach(p=>{const b=document.createElement('button');b.className='item'+(story&&story.id===p.id?' active':'');b.textContent=p.title;b.onclick=()=>open(p.id);a.append(b)});const c=$('chapterList');c.replaceChildren();if(!story)return;story.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='item'+(idx===i?' active':'');b.textContent=x.title;b.onclick=async()=>{await save();idx=i;fill()};c.append(b)})}
function fill(){if(!story)return;$('title').value=story.title;$('chapterTitle').value=story.chapters[idx].title;$('editor').value=story.chapters[idx].content;fields.forEach(f=>$(f).value=story[f]||'');$('memoryList').replaceChildren();(story.memories||[]).forEach((m,i)=>{const d=document.createElement('div');d.className='memory';d.textContent=m+' ';const b=document.createElement('button');b.textContent='ลบ';b.onclick=()=>{story.memories.splice(i,1);save().then(fill)};d.append(b);$('memoryList').append(d)});render()}
async function open(id){await save();const r=await api({action:'load',id});story=r.story;idx=0;fill()}
async function list(){const r=await api({action:'list'});items=r.items;render();if(items.length&&!story)await open(items[0].id)}
function sync(){if(!story)return;story.title=$('title').value;story.chapters[idx].title=$('chapterTitle').value;story.chapters[idx].content=$('editor').value;fields.forEach(f=>story[f]=$(f).value);$('saveStatus').textContent='กำลังรอบันทึก...';clearTimeout(timer);timer=setTimeout(()=>save().catch(error),850)}
async function save(){clearTimeout(timer);if(!story)return;await api({action:'save',story});$('saveStatus').textContent='บันทึกแล้ว';const p=items.find(p=>p.id===story.id);if(p)p.title=story.title;render()}
async function create(){await save();const s={id:crypto.randomUUID(),title:'นิยายเรื่องใหม่',chapters:[{title:'บทที่ 1',content:''}],memories:[]};await api({action:'save',story:s});items.unshift({id:s.id,title:s.title});story=s;idx=0;fill()}
async function models(){const p=$('provider').value;$('model').replaceChildren();const models=p==='kyrune'?[['kyrune-mini-1.0-free','Kyrune Mini Free']]:p==='meganova'?[['Sao10K/L3-70B-Euryale-v2.1','Euryale 70B Free'],['meganova-ai/manta-mini-1.0','Manta Mini Free']]:[];if(p==='horde'){try{const r=await api({action:'models'});r.models.forEach(m=>models.push([m,m]))}catch(e){error(e)}}models.forEach(m=>$('model').add(new Option(m[1],m[0])));const prev=sessionStorage['model_'+p];if(prev)$('model').value=prev}
$('enter').onclick=async()=>{pw=$('password').value;try{await api({action:'login'});sessionStorage.pw=pw;$('login').classList.add('hidden');await list();await models()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('pw');location.reload()};$('newStory').onclick=()=>create().catch(error);$('newChapter').onclick=async()=>{if(!story)return;await save();story.chapters.push({title:'บทที่ '+(story.chapters.length+1),content:''});idx=story.chapters.length-1;await save();fill()};['title','chapterTitle','editor',...fields].forEach(f=>$(f).oninput=sync);$('addMemory').onclick=async()=>{if(!story)return;const t=$('memoryText').value.trim();if(!t)return;story.memories.unshift(t);$('memoryText').value='';await save();fill()};$('provider').onchange=models;$('refreshModels').onclick=models;$('model').onchange=()=>sessionStorage['model_'+$('provider').value]=$('model').value;
$('generate').onclick=async()=>{if(!story)return error('สร้างนิยายก่อน');$('generate').disabled=true;try{await save();const j=await api({action:'generate',provider:$('provider').value,model:$('model').value,key:$('apiKey').value,story,idx,mode:$('mode').value,prompt:$('prompt').value,max:Number($('size').value)});proposal=j.text;usedMode=$('mode').value;$('notice').textContent=proposal;$('resultBox').classList.remove('hidden');$('accept').disabled=usedMode==='ideas'}catch(e){error(e)}finally{$('generate').disabled=false}};$('accept').onclick=()=>{if(!proposal)return;const c=story.chapters[idx];if(usedMode==='rewrite'){const pos=c.content.lastIndexOf('\n\n');c.content=c.content.slice(0,pos<0?0:pos+2)+proposal}else c.content=c.content.trimEnd()+'\n\n'+proposal;proposal='';$('resultBox').classList.add('hidden');$('editor').value=c.content;sync();save().catch(error)};$('dismiss').onclick=()=>$('resultBox').classList.add('hidden');
$('backup').onclick=()=>{if(!story)return;const a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(story,null,2)],{type:'application/json'}));a.href=u;a.download='nocturne-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{const s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.chapters))throw Error('ไฟล์ไม่ถูกต้อง');s.id=crypto.randomUUID();await api({action:'save',story:s});await list();await open(s.id)}catch(e){error(e)}};
if(pw)api({action:'login'}).then(()=>{$('login').classList.add('hidden');list();models()}).catch(()=>{sessionStorage.removeItem('pw');pw=''});
</script></html>
