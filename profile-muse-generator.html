*{box-sizing:border-box}body{margin:0;background:#090708;color:#eee8df;font-family:"Noto Serif Thai",serif}.app{width:min(1180px,96%);margin:22px auto;display:grid;grid-template-columns:350px 1fr;gap:18px}.panel,.stage{background:#111;border:1px solid #8f1f2938;box-shadow:0 20px 55px #000a}.panel{padding:20px;max-height:calc(100vh - 44px);overflow:auto;scrollbar-width:none}.panel::-webkit-scrollbar{display:none}.stage{min-height:760px;padding:18px;display:flex;align-items:flex-start;justify-content:center}.title{font:34px/1 "Cormorant Garamond";letter-spacing:.06em;color:#e8d8c6}.sub{margin-top:5px;font:8px "DM Mono";letter-spacing:.15em;color:#746a63}.label{margin:16px 0 6px;font:8px "DM Mono";letter-spacing:.16em;color:#b99a6b}.input,.select{width:100%;background:#080708;border:1px solid #ffffff18;color:#ddd0c4;padding:9px 10px;outline:0;font:11px "Noto Serif Thai"}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ver{width:100%;display:block;text-align:left;background:#0a0909;color:#bcb0a5;border:1px solid #ffffff14;padding:9px 10px;margin:6px 0;font:8px "DM Mono";letter-spacing:.08em;cursor:pointer}.ver.active{background:#281014;border-color:#b99a6b80;color:#ead4b5}.range{width:100%;accent-color:#9e2935}.rv{float:right;color:#756b64}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:17px}.btn{border:1px solid #9e293560;background:#251014;color:#e7d1b4;padding:10px;font:8px "DM Mono";letter-spacing:.12em;cursor:pointer}.out{width:100%;height:135px;margin-top:8px;background:#070607;color:#aaa;border:1px solid #ffffff14;font:9px monospace;padding:9px;resize:vertical}.muse{--r:#8f1f29;--r2:#c44c55;--g:#b99a6b;position:relative;width:100%;max-width:700px;min-height:720px;padding:25px;overflow:hidden;color:#eee5db;background:#090506 center/cover no-repeat;font-family:"Noto Serif Thai",serif;box-shadow:0 30px 70px #000d}.muse:before{content:"";position:absolute;inset:12px;border:1px solid #b99a6b66;box-shadow:inset 0 0 0 1px #8f1f2930;pointer-events:none}.muse>*{position:relative;z-index:1}.m-head{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid #b99a6b35;font:7px "DM Mono";letter-spacing:.2em;color:#988b80}.m-head i{font:18px "Cormorant Garamond";color:var(--g);font-style:normal}.m-photo{position:relative;width:72%;height:455px;margin:27px auto 0;padding:6px;background:#080607;border:1px solid #b99a6b90;box-shadow:0 25px 50px #000c;overflow:hidden}.m-photo:before{content:"";position:absolute;inset:10px;border:1px solid #b99a6b55;z-index:2}.m-photo img{width:100%;height:100%;display:block;object-fit:cover;transition:1s}.m-photo:hover img{transform:scale(1.035)}.m-name{text-align:center}.m-kicker{margin-top:21px;font:italic 17px "Cormorant Garamond";color:#c7b6a4}.m-name h1{margin:3px 0 0;font:600 80px/.8 "Cormorant Garamond";color:#f3e9df;letter-spacing:.015em;text-shadow:0 0 5px #fff4,0 0 15px var(--r2),0 0 35px var(--r);animation:mglow 4s ease-in-out infinite}.m-name h2{margin:16px 0 0;font:500 17px "Cormorant Garamond";letter-spacing:.32em;color:var(--g)}.m-quote{max-width:460px;margin:15px auto 0;text-align:center;font:italic 16px/1.7 "Cormorant Garamond";color:#bcb0a5}.m-meta{width:72%;margin:22px auto 0;display:flex;border-top:1px solid #b99a6b30;border-bottom:1px solid #b99a6b30}.m-meta div{flex:1;padding:10px 4px;text-align:center;font:9px "DM Mono";color:#c4b9af}.m-meta div+div{border-left:1px solid #b99a6b25}.m-meta b{display:block;margin-bottom:4px;font-size:7px;letter-spacing:.15em;color:var(--r2)}.m-foot{text-align:center;margin-top:21px;font:7px "DM Mono";letter-spacing:.2em;color:#665b54}@keyframes mglow{0%,100%{text-shadow:0 0 4px #fff4,0 0 12px var(--r),0 0 25px var(--r)}50%{text-shadow:0 0 6px #fff9,0 0 17px var(--r2),0 0 40px var(--r2),0 0 62px var(--r)}}@media(max-width:800px){.app{grid-template-columns:1fr}.panel{max-height:none}.stage{min-height:0}.m-photo,.m-meta{width:88%}}@media(max-width:520px){.muse{padding:20px}.m-photo{height:360px}.m-name </style></head><body><div class="app"><section class="panel"><div class="title">MUSE PROFILE</div><div class="sub">FACECLAIM · CHARACTER SHOWCASE</div><div class="label">DESIGN</div><div id="versions"><button class="ver active" data-v="1">01 · BLOOD ARISTOCRAT</button><button class="ver" data-v="2">02 · DARK HEIR</button><button class="ver" data-v="3">03 · BLACK ROSE</button><button class="ver" data-v="4">04 · WINE EDITORIAL</button></div><div class="label">BACKGROUND URL</div><input id="bg" class="input" value="https://i.pinimg.com/736x/81/3d/6d/813d6d51436f17304f0b5cb8ec20c74e.jpg"><div class="label">FACECLAIM IMAGE</div><input id="photo" class="input" value="https://i.pinimg.com/1200x/29/86/dd/2986ddb10910cbc7558120dc50c5ae04.jpg"><div class="label">NAME</div><div class="row"><input id="name" class="input" value="TRISTIAN"><input id="surname" class="input" value="SIDNEY KENNEDY"></div><div class="label">KICKER</div><input id="kicker" class="input" value="The story of"><div class="label">QUOTE</div><input id="quote" class="input" value="“The wound is gone, but the pain remembers.”"><div class="label">BIRTH / TYPE / STATUS</div><div class="row"><input id="birth" class="input" value="28 · 08 · 90"><input id="type" class="input" value="VAMPIRE"></div><input id="status" class="input" value="PRIVATE" style="margin-top:8px"><div class="label">NAME FONT</div><select id="nameFont" class="select"><option>Cormorant Garamond</option><option>Playfair Display</option></select><div class="label">NAME SIZE <span id="nsv" class="rv">80px</span></div><input id="nameSize" class="range" type="range" min="52" max="100" value="80"><div class="label">PHOTO HEIGHT <span id="phv" class="rv">455px</span></div><input id="photoH" class="range" type="range" min="300" max="540" value="455"><div class="label">PHOTO ZOOM <span id="zv" class="rv">1.00</span></div><input id="zoom" class="range" type="range" min="1" max="1.25" step=".01" value="1"><div class="label">PHOTO POSITION X <span id="xv" var v=1,$=function(i){return document.getElementById(i)};var themes=[null,{r:"#8f1f29",r2:"#c44c55",g:"#b99a6b"},{r:"#651f2a",r2:"#a5525a",g:"#c5ad82"},{r:"#761c30",r2:"#bd4257",g:"#aa9675"},{r:"#7b2635",r2:"#a94b5b",g:"#c1a37a"}];
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function d(){return{bg:$("bg").value,photo:$("photo").value,name:$("name").value,surname:$("surname").value,kicker:$("kicker").value,quote:$("quote").value,birth:$("birth").value,type:$("type").value,status:$("status").value,font:$("nameFont").value,size:$("nameSize").value,ph:$("photoH").value,zoom:$("zoom").value,x:$("x").value,y:$("y").value}}
function render(){var a=d(),t=themes[v];$("nsv").textContent=a.size+"px";$("phv").textContent=a.ph+"px";$("zv").textContent=a.zoom;$("xv").textContent=a.x+"%";$("yv").textContent=a.y+"%";$("preview").innerHTML='<div class="muse" style="--r:'+t.r+';--r2:'+t.r2+';--g:'+t.g+';background-image:linear-gradient(180deg,#05050535,#050505d5 72%,#050505f4 100%),url(\''+e(a.bg)+'\')"><div class="m-head"><span>PRIVATE COLLECTION</span><i>✦</i><span>TRIS · XVII</span></div><div class="m-photo" style="height:'+a.ph+'px"><img src="'+e(a.photo)+'" style="transform:scale('+a.zoom+');object-position:'+a.x+'% '+a.y+'%"></div><div class="m-name"><div class="m-kicker">'+e(a.kicker)+'</div><h1 style="font-family:\''+e(a.font)+'\',serif;font-size:'+a.size+'px">'+e(a.name)+'</h1><h2>'+e(a.surname)+'</h2><div class="m-quote">'+e(a.quote)+'</div></div><div class="m-meta"><div><b>BORN</b>'+e(a.birth)+'</div><div><b>TYPE</b>'+e(a.type)+'</div><div><b>STATUS</b>'+e(a.status)+'</div></div><div class="m-foot">A PRIVATE COLLECTION · TSK</div></div>'}
function code(){var a=d(),t=themes[v];return '<style>@import url(\'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap\');.muse{--r:'+t.r+';--r2:'+t.r2+';--g:'+t.g+';position:relative;width:min(700px,100%);margin:18px auto;padding:25px;overflow:hidden;color:#eee5db;background:linear-gradient(180deg,#05050535,#050505d5 72%,#050505f4 100%),url(\''+e(a.bg)+'\') center/cover no-repeat;font-family:serif;box-shadow:0 30px 70px #000d}.muse:before{content:"";position:absolute;inset:12px;border:1px solid #b99a6b66;pointer-events:none}.muse>*{position:relative;z-index:1}.m-head{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid #b99a6b35;font:7px "DM Mono";letter-spacing:.2em;color:#988b80}.m-head i{font:18px "Cormorant Garamond";color:var(--g)}.m-photo{position:relative;width:72%;height:'+a.ph+'px;margin:27px auto 0;padding:6px;background:#080607;border:1px solid #b99a6b90;box-shadow:0 25px 50px #000c;overflow:hidden}.m-photo:before{content:"";position:absolute;inset:10px;border:1px solid #b99a6b55;z-index:2}.m-photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:'+a.x+'% '+a.y+'%;transform:scale('+a.zoom+')}.m-name{text-align:center}.m-kicker{margin-top:21px;font:italic 17px "Cormorant Garamond";color:#c7b6a4}.m-name h1{margin:3px 0 0;font:600 '+a.size+'px/.8 "'+e(a.font)+'";color:#f3e9df;text-shadow:0 0 5px #fff4,0 0 15px var(--r2),0 0 35px var(--r);animation:mglow 4s ease-in-out infinite}.m-name h2{margin:16px 0 0;font:500 17px "Cormorant Garamond";letter-spacing:.32em;color:var(--g)}.m-quote{max-width:460px;margin:15px auto 0;text-align:center;font:italic 16px/1.7 "Cormorant Garamond";color:#bcb0a5}.m-meta{width:72%;margin:22px auto 0;display:flex;border-top:1px solid #b99a6b30;border-bottom:1px solid #b99a6b30}.m-meta div{flex:1;padding:10px 4px;text-align:center;font:9px "DM Mono";color:#c4b9af}.m-meta div+div{border-left:1px solid #b99a6 document.querySelectorAll(".ver").forEach(function(b){b.onclick=function(){document.querySelectorAll(".ver").forEach(function(x){x.classList.remove("active")});b.classList.add("active");v=+b.dataset.v;render()}});document.querySelectorAll("input,select").forEach(function(x){x.addEventListener("input",render)});$("gen").onclick=function(){$("out").value=code()};$("copy").onclick=function(){var x=$("out").value||code();$("out").value=x;if(navigator.clipboard)navigator.clipboard.writeText(x)};render();
</script></body></html>
