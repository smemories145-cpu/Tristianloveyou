<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roleplay Code Tester</title><style>@import url("https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap");*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Prompt,sans-serif}.app{max-width:1250px;margin:auto;padding:28px 18px}.head{text-align:center;margin-bottom:25px}.head h1{margin:0;font-family:"Playfair Display",serif;font-size:34px}.head p{margin:6px 0;color:#9b9793;font-size:14px}.back{display:inline-block;margin-top:10px;color:#cdbba8;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#19191b;border:1px solid #353438;padding:18px;box-shadow:0 12px 35px #0005}.label{font-size:11px;letter-spacing:2px;color:#cdbba8;margin-bottom:10px}textarea{width:100%;height:70vh;min-height:520px;resize:vertical;background:#090909;color:#ddd;border:1px solid #343136;padding:14px;font:13px monospace;outline:none}textarea:focus{border-color:#9d8b79}.preview{width:100%;height:70vh;min-height:520px;border:1px solid #343136;background:#fff}.bar{display:flex;gap:8px;margin-top:12px}.bar button{flex:1;border:1px solid #474349;padding:11px;background:#29272a;color:#eee;font:600 12px Prompt,sans-serif;cursor:pointer}.bar button:first-child{background:#c8b39d;color:#171515;border:0}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview,textarea{height:60vh;min-height:450px}}</style></head><body><main class="app"><div class="head"><h1>Roleplay Code Tester</h1><p>วาง HTML / CSS / JavaScript เพื่อดู Preview ก่อนเอาไปใช้</p><a class="back" href="index.html">← กลับไป Roleplay Code Generator</a></div><div class="grid"><section class="panel"><div class="label">PASTE YOUR CODE</div><textarea id="code" placeholder="วางโค้ดของคุณตรงนี้..."></textarea><div class="bar"><button id="run">▶ PREVIEW</button><button id="clear">CLEAR</button><button id="copy">COPY</button></div></section><section class="panel"><div class="label">LIVE PREVIEW</div><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></section></div></main><script>const c=document.getElementById("code"),p=document.getElementById("preview");function run(){p.srcdoc=c.value}document.getElementById("run").onclick=run;c.addEventListener("input",run);document.getElementById("clear").onclick=()=>{c.value="";run()};document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(c.value)}catch(e){c.select();document.execCommand("copy")}};</script></body></html>
